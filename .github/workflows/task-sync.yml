name: Task Sync

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: task-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # "ydk" on PyPI is an unrelated package (name collision) — the real tool
      # is only published at github.com/yoavarad/ydk. Install from that repo, not
      # PyPI. Installs into an isolated tool venv (PEP 668 blocks system installs).
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install ydk
        run: uv tool install --python 3.13 git+https://github.com/yoavarad/ydk.git

      - name: Run ydk task sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ydk task sync

      - name: Commit synced task state
        run: |
          if [ -n "$(git status --porcelain -- .ydk)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .ydk
            git commit -m "chore(tasks): auto-sync task status after PR merge"
            git push origin HEAD:${{ github.event.pull_request.base.ref }}
          else
            echo "No task state changes, skipping commit."
          fi
