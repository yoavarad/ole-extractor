tasks:
  # --- Epic 8: Dataset Curation — synthetic generator (story S-41ebb945) ---
  - id: task-synthetic-fixtures-scaffold
    title: "Build synthetic sample generator scaffolding and shared multilingual/emoji fixture library"
    story: S-41ebb945
    description: >
      Build the programmatic generator project/harness for synthetic samples
      and a shared fixture library of multilingual (Hebrew/Arabic/Persian/
      Russian/Latin/CJK) text and emoji (including multi-codepoint sequences)
      reused across all 6 formats' generated body text and metadata fields.
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "A generator harness can programmatically author doc/xls/ppt/docx/xlsx/pptx files with controllable body text, metadata fields, and embeddings"
      - "A shared fixture library provides multilingual/mixed-script text and emoji strings reusable across all 6 formats' generation code"
      - "Fixture strings cover Hebrew, Arabic, Persian, Russian, Latin-script, and CJK text plus at least one multi-codepoint emoji sequence"
    depends_on: []
    # cross-sprint (Sprint 1, real ID, added post-creation): T-a5f1d074:blocks
    test_strategy: "No test — infra/tooling task; correctness is verified indirectly by the samples the scaffolding produces."

  - id: task-synthetic-multi-embedding
    title: "Generate multi-embedding synthetic samples for all 6 formats"
    story: S-41ebb945
    description: >
      Generate one synthetic sample per format (6 total) with at least 3
      first-layer embedded objects/media of at least 2 different kinds,
      including multilingual/emoji content in body text and at least 2
      metadata fields.
    spec_refs:
      - docs/specs/dataset-curation.md
    component_refs:
      - ydk:req:extraction/subfile-scope
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "6 multi-embedding synthetic samples exist (1 per format), each with at least 3 first-layer embedded objects/media of at least 2 different kinds"
      - "Each sample's body text and at least 2 metadata fields contain multilingual/mixed-script text and emoji"
      - "Each sample's exact expected subfile count and filenames are known and recordable"
    depends_on:
      - "task-synthetic-fixtures-scaffold:blocks"
    test_strategy: "No test — infra/tooling task; samples are asserted against by Epic 9's integration tests once recorded in the corpus manifest."

  - id: task-synthetic-large-body
    title: "Generate 100k+ word body synthetic samples for all 6 formats"
    story: S-41ebb945
    description: >
      Generate one synthetic sample per format (6 total) with a text body
      exceeding 100,000 words, including multilingual/emoji content in body
      text and at least 2 metadata fields.
    spec_refs:
      - docs/specs/dataset-curation.md
    component_refs:
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "6 large-body synthetic samples exist (1 per format), each with a text body exceeding 100,000 words"
      - "Each sample's body text and at least 2 metadata fields contain multilingual/mixed-script text and emoji"
      - "Each sample's exact expected text content is deterministic and recordable in the manifest (generated, not random-per-run)"
    depends_on:
      - "task-synthetic-fixtures-scaffold:blocks"
    test_strategy: "No test — infra/tooling task; samples are asserted against by Epic 9's integration tests once recorded in the corpus manifest."

  - id: task-synthetic-macro-embedding
    title: "Generate macro-enabled-with-embedding synthetic samples for all 6 formats"
    story: S-41ebb945
    description: >
      Generate one synthetic sample per format (6 total) that is a
      macro-enabled variant (docm/xlsm/pptm, or legacy doc/xls/ppt with a
      macro storage) with at least one embedding, including multilingual/
      emoji content in body text and at least 2 metadata fields.
    spec_refs:
      - docs/specs/dataset-curation.md
    component_refs:
      - ydk:req:extraction/unicode-fidelity
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "6 macro-enabled-with-embedding synthetic samples exist (1 per format), each with at least one macro/VBA storage and at least one first-layer embedding"
      - "Each sample's body text and at least 2 metadata fields contain multilingual/mixed-script text and emoji"
      - "Each sample exercises Epic 5/6's macro-variant-misclassification test scenario (docm/xlsm/pptm detect as their base format)"
    depends_on:
      - "task-synthetic-fixtures-scaffold:blocks"
    test_strategy: "No test — infra/tooling task; samples are asserted against by Epic 9's integration tests (macro-variant-misclassification scenario) once recorded in the corpus manifest."

  - id: task-synthetic-manifest
    title: "Record synthetic samples in samples/manifest.json"
    story: S-41ebb945
    description: >
      Record all 18 synthetic samples (3 per format x 6 formats) in
      samples/manifest.json: format, which composition rule each satisfies,
      expected detected format, and exact expected text/metadata strings and
      subfile count+filenames.
    spec_refs:
      - docs/specs/dataset-curation.md
    component_refs: []
    acceptance:
      - "18 synthetic samples exist (3 per format x 6 formats) per dataset-curation.md's Corpus Composition rule 1"
      - "Every synthetic sample's manifest entry records format, composition rule satisfied, expected detected format, and exact expected text/metadata/subfile-count+filenames (not descriptions)"
      - "Every synthetic sample is tagged self-generated in samples/manifest.json"
    depends_on:
      - "task-synthetic-multi-embedding:blocks"
      - "task-synthetic-large-body:blocks"
      - "task-synthetic-macro-embedding:blocks"
    test_strategy: "No test — infra/tooling task; this manifest is the ground truth Epic 9's integration tests assert against."

  # --- Epic 8: Dataset Curation — curated samples (story S-da936361) ---
  - id: task-curated-source-samples
    title: "Source/author 12 curated real-world-style samples (2 per format)"
    story: S-da936361
    description: >
      Source or self-author (in Office/LibreOffice) 12 real-world-style
      samples (2 per format x 6 formats), each from a checked-and-recorded
      license if third-party, or tagged self-generated if authored directly.
    spec_refs:
      - docs/specs/dataset-curation.md
    component_refs: []
    acceptance:
      - "12 curated samples exist (2 per format x 6 formats)"
      - "Each sample is either self-authored in Office/LibreOffice or drawn from a public-domain/OSS collection with a checked, recorded license"
      - "No curated sample duplicates a synthetic sample's content or purpose"
    depends_on: []
    test_strategy: "No test — infra/tooling task; samples are asserted against by Epic 9's integration tests once recorded in the corpus manifest."

  - id: task-curated-nested-embedding
    title: "Author/source the 2+-level nested-embedding curated sample"
    story: S-da936361
    description: >
      Ensure at least one curated sample has 2+ levels of nested embedding
      (an embedded object that itself contains an embedded object), to
      exercise the "subfile that is itself a container" behavior from
      subfile-scope (the outer embedding is one opaque SubfileItem; its own
      contents are not separately listed).
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "At least one curated sample has 2+ levels of nested embedding (an embedded object that itself contains an embedded object)"
      - "The sample's expected Subfiles list records the outer embedding as one opaque entry, per subfile-scope's no-recursive-unpacking rule"
    depends_on:
      - "task-curated-source-samples:blocks"
    test_strategy: "No test — infra/tooling task; this sample is asserted against by Epic 9's integration tests (deeply-nested embedding scenario) once recorded in the corpus manifest."

  - id: task-curated-revision-history
    title: "Author/source the real multi-user revision-history curated sample"
    story: S-da936361
    description: >
      Ensure at least one curated sample carries a real (not scripted)
      multi-user authorship/revision-history property chain, from having
      been edited by multiple real users across multiple real save
      operations (exercising RevisionNumber/LastModifiedBy/EditingDurationMinutes
      fields with genuine, not synthetic, values).
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
    acceptance:
      - "At least one curated sample carries a real (not scripted) multi-user authorship/revision-history property chain from genuine multi-save edits"
      - "The sample's manifest entry records the exact expected Author/LastModifiedBy/RevisionNumber values as actually stored, not idealized values"
    depends_on:
      - "task-curated-source-samples:blocks"
    test_strategy: "No test — infra/tooling task; this sample is asserted against by Epic 9's integration tests once recorded in the corpus manifest."

  - id: task-curated-manifest
    title: "Record curated samples in samples/manifest.json"
    story: S-da936361
    description: >
      Record all 12 curated samples in samples/manifest.json: format,
      composition rule satisfied, expected detected format, exact expected
      text/metadata/subfile-count+filenames where applicable, and
      self-generated-vs-third-party tag with license for third-party
      samples.
    spec_refs:
      - docs/specs/dataset-curation.md
    component_refs: []
    acceptance:
      - "All 12 curated samples have manifest entries recording format, composition rule satisfied, expected detected format, and exact expected content fields"
      - "Every curated sample is tagged self-generated vs. third-party, with license recorded for third-party samples"
      - "The 2+-level-nesting and multi-user-revision-history samples are each identifiable in the manifest as satisfying their specific composition rule"
    depends_on:
      - "task-curated-source-samples:blocks"
      - "task-curated-nested-embedding:blocks"
      - "task-curated-revision-history:blocks"
    test_strategy: "No test — infra/tooling task; this manifest is the ground truth Epic 9's integration tests assert against."

  # --- Epic 8: Dataset Curation — adversarial set + corpus manifest (story S-6bc8566f) ---
  - id: task-adversarial-corrupt-truncated-zerobyte
    title: "Produce corrupt, truncated, and zero-byte adversarial samples"
    story: S-6bc8566f
    description: >
      Produce one corrupt sample (structurally malformed, unparseable), one
      truncated sample (declared size exceeds actual byte length), and one
      zero-byte sample, derived from valid synthetic samples where practical,
      each tagged with which format(s) it targets.
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:error:extraction/corrupt-file
      - ydk:error:extraction/truncated-container
    acceptance:
      - "One corrupt sample exists that is structurally malformed and unparseable, tagged with its target format(s)"
      - "One truncated sample exists whose declared container size exceeds its actual byte length, tagged with its target format(s)"
      - "One zero-byte sample exists, tagged with its target format(s)"
    depends_on:
      - "task-synthetic-manifest:blocks"
    test_strategy: "No test — infra/tooling task; these samples are asserted against by Epic 9's integration tests once recorded in the corpus manifest."

  - id: task-adversarial-bomb-password
    title: "Produce oversized-declared-size (bomb) and password-protected adversarial samples"
    story: S-6bc8566f
    description: >
      Produce one oversized-declared-size sample (a small file whose
      declared ZIP/CFB internal structure exceeds nesting-depth-guard's caps
      — a zip/CFB bomb) and one password-protected sample (document-open
      password or CFB EncryptionInfo/EncryptedPackage stream), each tagged
      with which format(s) it targets.
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/adrs/002-profiling-and-stress-testing.md
    component_refs:
      - ydk:nfr:extraction/nesting-depth-guard
      - ydk:error:extraction/oversized-nested-content
      - ydk:error:extraction/password-protected
    acceptance:
      - "One oversized-declared-size sample exists whose declared internal size exceeds nesting-depth-guard's 1GB per-entry / 2GB total caps while its actual bytes are small, tagged with its target format(s)"
      - "One password-protected sample exists with a genuine document-open password/encryption stream, tagged with its target format(s)"
      - "Neither sample requires actually allocating gigabytes of data to construct (crafted declared-size headers, not real bulk content)"
    depends_on:
      - "task-synthetic-manifest:blocks"
    test_strategy: "No test — infra/tooling task; these samples are asserted against by Epic 9's integration tests once recorded in the corpus manifest."

  - id: task-adversarial-wrongext-corruptembed
    title: "Produce wrong-extension and corrupt-embedded-object adversarial samples"
    story: S-6bc8566f
    description: >
      Produce one wrong-extension sample (correct content, misleading or
      missing filename extension) and one sample with a single corrupt
      embedded object alongside otherwise-valid content, each tagged with
      which format(s) it targets.
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:req:extraction/content-only-mime-detection
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "One wrong-extension sample exists with valid content and a misleading or missing filename extension, tagged with its target format"
      - "One corrupt-embedded-object sample exists with otherwise-valid content and exactly one corrupt first-layer embedding, tagged with its target format"
      - "Both samples' correct expected outcome (correct detected format regardless of extension; successful extraction omitting only the corrupt embedding) is recorded"
    depends_on:
      - "task-synthetic-manifest:blocks"
    test_strategy: "No test — infra/tooling task; these samples are asserted against by Epic 9's integration tests once recorded in the corpus manifest."

  - id: task-corpus-manifest-finalize
    title: "Assemble and finalize samples/manifest.json as the ground-truth corpus manifest"
    story: S-6bc8566f
    description: >
      Merge the synthetic, curated, and adversarial manifest entries into
      one finalized samples/manifest.json, validating every sample file on
      disk has a corresponding manifest entry and every manifest entry
      points to a real sample file, closing out Dataset Curation as the
      ground truth the test suite asserts against.
    spec_refs:
      - docs/specs/dataset-curation.md
    component_refs:
      - ydk:nfr:extraction/nesting-depth-guard
    acceptance:
      - "samples/manifest.json contains entries for all 18 synthetic + 12 curated + 7 adversarial samples (37 total)"
      - "Every sample file on disk under samples/ has a corresponding manifest entry; a sample without a manifest entry does not count toward corpus coverage"
      - "Every manifest entry's format, composition-rule, expected-detected-format, and exact-expected-content fields are present and non-placeholder"
    depends_on:
      - "task-synthetic-manifest:blocks"
      - "task-curated-manifest:blocks"
      - "task-adversarial-corrupt-truncated-zerobyte:blocks"
      - "task-adversarial-bomb-password:blocks"
      - "task-adversarial-wrongext-corruptembed:blocks"
    test_strategy: "No test — infra/tooling task; this is the manifest-validation gate Epic 9's integration tests depend on."

  # --- Epic 9: Test Suite — integration tests (story S-f6d7124a) ---
  - id: task-integration-detect-tests
    title: "Integration tests: DetectMimeType against every corpus manifest sample"
    story: S-f6d7124a
    description: >
      Integration test suite calling DetectMimeType against every sample in
      samples/manifest.json, asserting the exact expected DetectedFormat
      recorded in the manifest, with no mocking of the detection components.
    spec_refs:
      - docs/specs/testing-strategy.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
    acceptance:
      - "Every corpus sample in samples/manifest.json has a corresponding integration test asserting exact expected DetectedFormat"
      - "No detection component is mocked in these tests"
      - "Wrong-extension and macro-variant samples assert the correct format independent of filename/macro presence"
    depends_on:
      - "task-corpus-manifest-finalize:blocks"
    # cross-sprint (Sprint 2, real IDs, added post-creation): T-fb89c6f3:blocks
    test_strategy: "Corpus-sample-backed: exercises the full corpus manifest end-to-end against the real DetectMimeType facade, per testing-strategy.md's integration-test definition."

  - id: task-integration-extract-tests
    title: "Integration tests: Extract against every corpus manifest sample"
    story: S-f6d7124a
    description: >
      Integration test suite calling Extract against every sample in
      samples/manifest.json, asserting exact expected text/metadata/subfile
      list from the manifest — never asserting only "text is non-empty"
      where an exact string is recorded — with no mocking of the
      format-handling components.
    spec_refs:
      - docs/specs/testing-strategy.md
    component_refs:
      - ydk:contract:extraction/extract
    acceptance:
      - "Every corpus sample in samples/manifest.json has a corresponding integration test asserting exact expected text/metadata/subfile-list"
      - "No test asserts only 'text is non-empty' where the manifest records an exact expected string"
      - "No format-handling component is mocked in these tests"
    depends_on:
      - "task-corpus-manifest-finalize:blocks"
    # cross-sprint (Sprint 2, real IDs, added post-creation): T-3335d397:blocks, T-61477563:blocks, T-a2b91dc6:blocks
    test_strategy: "Corpus-sample-backed: exercises the full corpus manifest end-to-end against the real Extract facade, per testing-strategy.md's integration-test definition and unicode-fidelity's byte-exact assertion rule."

  - id: task-integration-adversarial-tests
    title: "Integration tests for corpus-sample-backed adversarial scenarios"
    story: S-f6d7124a
    description: >
      Integration tests covering every corpus-sample-backed adversarial
      scenario from overview.md via the three-mechanism coverage rule:
      corrupt, truncated, zero-byte, oversized, password-protected,
      wrong-extension, and corrupt-embedded-object (shared adversarial set);
      macro-variant-misclassification (per-format macro synthetic sample);
      deeply-nested embedding (the curated 2+-level-nesting sample).
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/specs/overview.md
    component_refs:
      - ydk:error:extraction/corrupt-file
      - ydk:error:extraction/truncated-container
      - ydk:error:extraction/oversized-nested-content
      - ydk:error:extraction/password-protected
      - ydk:req:extraction/content-only-mime-detection
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "Each of the 7 shared adversarial-set samples has a passing test asserting the correct specific error (or, for corrupt-embedded-object, the correct omit-and-log behavior)"
      - "Each format's macro-enabled synthetic sample has a passing test asserting correct base-format classification (macro-variant-misclassification scenario)"
      - "The 2+-level-nesting curated sample has a passing test asserting the outer embedding is one opaque SubfileItem"
    depends_on:
      - "task-integration-detect-tests:blocks"
      - "task-integration-extract-tests:blocks"
    test_strategy: "Corpus-sample-backed: every corpus-sample-backed adversarial scenario from overview.md has a passing test per testing-strategy.md's three-mechanism coverage rule."

  # --- Epic 9: Test Suite — unit tests (story S-814fa928) ---
  - id: task-unit-null-validation-detect
    title: "Unit tests for null request/field validation on DetectMimeType"
    story: S-814fa928
    description: >
      Unit tests asserting a null MimeDetectionRequest and a null FileBytes
      field each throw immediately, before any detection logic runs,
      verified via a spy/counter on the detection registry rather than just
      catching an exception type.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/MimeDetectionRequest
    acceptance:
      - "A null MimeDetectionRequest throws immediately, verified via a spy/counter showing zero detection-component invocations"
      - "A MimeDetectionRequest with a null FileBytes throws immediately, verified the same way"
    depends_on: []
    # cross-sprint (Sprint 2, real ID, added post-creation): T-fb89c6f3:blocks
    test_strategy: "Unit-test-backed: no checked-in sample needed, per testing-strategy.md's unit-test-backed mechanism for null request/field validation."

  - id: task-unit-null-validation-extract
    title: "Unit tests for null request/field validation on Extract"
    story: S-814fa928
    description: >
      Unit tests asserting a null ExtractionRequest and each null required
      field (FileBytes, FileName, DetectedMimeType) throw immediately,
      before any detection/extraction logic runs, verified via a spy/counter.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/ExtractionRequest
    acceptance:
      - "A null ExtractionRequest throws immediately, verified via a spy/counter showing zero format-handling-component invocations"
      - "An ExtractionRequest with a null FileBytes, null FileName, or null DetectedMimeType each throw immediately, verified the same way"
    depends_on: []
    # cross-sprint (Sprint 2, real ID, added post-creation): T-a2b91dc6:blocks
    test_strategy: "Unit-test-backed: no checked-in sample needed, per testing-strategy.md's unit-test-backed mechanism for null request/field validation."

  - id: task-unit-file-too-large
    title: "Unit tests for file-too-large on both public functions"
    story: S-814fa928
    description: >
      Unit tests using a synthetic 100MB+1byte input asserting file-too-large
      is raised before any format-specific parsing runs on both
      DetectMimeType and Extract, verified via a spy/counter, and confirming
      the limit is read from configuration rather than hardcoded.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:nfr:extraction/max-file-size
      - ydk:error:extraction/file-too-large
    acceptance:
      - "A synthetic 100MB+1byte input to DetectMimeType triggers file-too-large before any format-specific parsing runs, verified via a spy/counter"
      - "A synthetic 100MB+1byte input to Extract triggers file-too-large before any format-specific parsing runs, verified via a spy/counter"
      - "Changing the configured max-file-size limit changes accepted/rejected behavior in the test, proving the limit is read from configuration, not hardcoded"
    depends_on: []
    # cross-sprint (Sprint 2, real IDs, added post-creation): T-fb89c6f3:blocks, T-3335d397:blocks
    test_strategy: "Unit-test-backed: synthetic oversized byte-array length, per max-file-size's own test_method, exactly as specified in testing-strategy.md's unit-test-backed mechanism list."

  # --- Epic 10: Time Profiling (story S-709fe2de) ---
  - id: task-benchmark-scaffold
    title: "Scaffold separate BenchmarkDotNet project"
    story: S-709fe2de
    description: >
      Create a separate BenchmarkDotNet project referencing the extraction
      library, kept out of the unit/integration test suite gate, per ADR-002.
    spec_refs:
      - docs/adrs/002-profiling-and-stress-testing.md
    component_refs: []
    acceptance:
      - "A separate BenchmarkDotNet project exists, referencing ExtractorOLE and building independently of the unit/integration test suite project(s)"
      - "The benchmark project is not part of the standard `dotnet test` gate"
    depends_on: []
    # cross-sprint (Sprint 2, real IDs, added post-creation): T-fb89c6f3:blocks, T-3335d397:blocks, T-61477563:blocks, T-a2b91dc6:blocks
    test_strategy: "No test — infra/tooling task."

  - id: task-benchmark-extract-latency
    title: "Implement Extract() latency/allocation benchmarks per format"
    story: S-709fe2de
    description: >
      Implement BenchmarkDotNet benchmarks running Extract() against a fixed
      10MB and a fixed ~100MB sample for each of the 6 formats, reporting
      P50/P95 latency and allocated bytes, per extraction-latency and
      memory-ceiling.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/adrs/002-profiling-and-stress-testing.md
    component_refs:
      - ydk:nfr:extraction/extraction-latency
      - ydk:nfr:extraction/memory-ceiling
    acceptance:
      - "BenchmarkDotNet project runs Extract() against a fixed 10MB and a fixed ~100MB sample for each of the 6 formats"
      - "Each run reports P50/P95 latency and allocated-bytes-per-input-byte"
      - "10MB benchmarks target P95 < 500ms and 100MB benchmarks target P95 < 5s, per extraction-latency's target"
    depends_on:
      - "task-benchmark-scaffold:blocks"
      - "task-corpus-manifest-finalize:blocks"
    test_strategy: "No test — this task IS the profiling mechanism referenced by testing-strategy.md's Time Profiling test type, run separately from the unit/integration suite gate."

  - id: task-benchmark-baseline-ci
    title: "Establish committed baseline and CI regression documentation"
    story: S-709fe2de
    description: >
      Commit a baseline benchmark result and document what a >20% P95
      regression against that baseline means for CI, per
      extraction-latency's test_method.
    spec_refs:
      - docs/adrs/002-profiling-and-stress-testing.md
      - docs/specs/testing-strategy.md
    component_refs:
      - ydk:nfr:extraction/extraction-latency
    acceptance:
      - "A baseline benchmark result is committed to the repository"
      - "Documentation states that CI fails the profiling task if P95 regresses more than 20% against the committed baseline"
      - "The benchmark run is documented as separate from the unit/integration test suite gate"
    depends_on:
      - "task-benchmark-extract-latency:blocks"
    test_strategy: "No test — infra/tooling task; the baseline itself becomes the regression-detection mechanism for future benchmark runs."

  # --- Epic 11: Stress Test Harness (story S-d88f514b) ---
  - id: task-stress-harness-scaffold
    title: "Scaffold hand-rolled concurrent-load console harness"
    story: S-d88f514b
    description: >
      Scaffold a hand-rolled console harness project (Parallel.ForEachAsync/
      SemaphoreSlim + Stopwatch, per ADR-002) referencing the extraction
      library, kept out of the standard test suite gate.
    spec_refs:
      - docs/adrs/002-profiling-and-stress-testing.md
    component_refs: []
    acceptance:
      - "A separate console harness project exists, referencing ExtractorOLE, using Parallel.ForEachAsync/SemaphoreSlim and Stopwatch per ADR-002's tooling choice"
      - "The harness is not part of the standard test suite gate; it runs manually or as a longer CI job"
    depends_on: []
    # cross-sprint (Sprint 2, real IDs, added post-creation): T-fb89c6f3:blocks, T-3335d397:blocks, T-61477563:blocks, T-a2b91dc6:blocks
    test_strategy: "No test — infra/tooling task."

  - id: task-stress-harness-concurrent-calls
    title: "Implement >=50 concurrent-call exercise of both public functions"
    story: S-d88f514b
    description: >
      Implement the harness's core load-generation logic: at least 50
      concurrent calls to both DetectMimeType and Extract, configurable
      higher for extended runs, against a mix of shared and different corpus
      files.
    spec_refs:
      - docs/adrs/002-profiling-and-stress-testing.md
      - docs/specs/testing-strategy.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:contract:extraction/extract
    acceptance:
      - "Harness exercises at least 50 concurrent calls to DetectMimeType and at least 50 concurrent calls to Extract"
      - "Concurrency level is configurable higher than 50 for extended runs"
      - "Calls are exercised against both the same file (shared state) and different files concurrently"
    depends_on:
      - "task-stress-harness-scaffold:blocks"
      - "task-corpus-manifest-finalize:blocks"
    test_strategy: "Stress-harness-backed: concurrent calls on shared/different files, per testing-strategy.md's stress-harness-backed mechanism for the concurrent-load scenario."

  - id: task-stress-harness-reporting
    title: "Report throughput/latency/memory under load and confirm no shared-state issues"
    story: S-d88f514b
    description: >
      Add throughput/latency/memory-under-load reporting to the stress
      harness, and confirm via the run's results that there is no
      shared-mutable-state issue across concurrent calls on the same or
      different files.
    spec_refs:
      - docs/adrs/002-profiling-and-stress-testing.md
      - docs/specs/testing-strategy.md
    component_refs: []
    acceptance:
      - "Harness run output reports throughput (calls/sec), latency distribution, and memory under load"
      - "A run against the same file from multiple concurrent callers produces consistent, correct results with no cross-call corruption"
      - "A run confirms no shared-mutable-state issue across concurrent calls on the same/different files"
    depends_on:
