tasks:
  # --- Epic 3: CFB / Legacy Mime Detection (story S-3bc6b929) ---
  - id: task-cfb-detect-core
    title: "Implement CFB directory-entry detection component for doc/xls/ppt"
    story: S-3bc6b929
    description: >
      Implement a detection component that opens FileBytes as a compound file
      via OpenMcdf and inspects root storage/stream names ("WordDocument",
      "Workbook"/"Book", "PowerPoint Document") to distinguish doc/xls/ppt,
      without performing a full document parse.
    spec_refs:
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:entity:extraction/MimeDetectionRequest
      - ydk:entity:extraction/MimeDetectionResult
      - ydk:req:extraction/content-only-mime-detection
    acceptance:
      - "A CFB detection component distinguishes doc/xls/ppt by inspecting only root storage/stream names via OpenMcdf, with no full document parse"
      - "Detection never reads request.FileName to decide the result"
      - "A CFB-structured file matching none of the three known root-entry signatures returns the Unknown result, never an exception"
    depends_on: []
    # cross-sprint (Sprint 1, real IDs, added post-creation): T-d7c81051:blocks, T-2ac2f140:blocks
    test_strategy: "Unit-test-backed: unit tests feed hand-crafted CFB byte arrays with each of the three known root-entry signatures and assert the correct DetectedFormat, plus one CFB file with an unrecognized root entry asserting Unknown."

  - id: task-cfb-detect-guardrails
    title: "Enforce max-file-size and nesting-depth-guard checks in the CFB detection path"
    story: S-3bc6b929
    description: >
      Add the max-file-size and nesting-depth-guard checks ahead of CFB
      directory/FAT-chain inspection in the CFB detection component, so an
      oversized input or an implausible declared FAT-chain size is rejected
      before any declared-size inspection proceeds.
    spec_refs:
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:nfr:extraction/max-file-size
      - ydk:nfr:extraction/nesting-depth-guard
      - ydk:error:extraction/file-too-large
      - ydk:error:extraction/oversized-nested-content
    acceptance:
      - "max-file-size and nesting-depth-guard checks run before any CFB declared-size (FAT chain) inspection"
      - "A byte array over the configured max-file-size limit raises file-too-large before CFB structural inspection begins"
      - "A structurally-tiny CFB file whose declared FAT chain implies >2GB total raises oversized-nested-content, not an exception or hang"
    depends_on:
      - "task-cfb-detect-core:blocks"
    test_strategy: "Unit-test-backed: synthetic crafted CFB input with an implausible declared FAT-chain length is rejected via an allocation spy, per nesting-depth-guard's test_method; a >100MB synthetic byte array is rejected before any CFB parsing runs."

  - id: task-cfb-detect-registry
    title: "Register CFB detection component in the DI dispatch registry"
    story: S-3bc6b929
    description: >
      Register the CFB detection component in the DI-registered format
      registry wired in Sprint 1 (T-90924b6d), alongside the existing OOXML
      structural check, so both dispatch through the same registry mechanism.
    spec_refs:
      - docs/specs/mime-detection.md
      - docs/specs/overview.md
    component_refs:
      - ydk:req:extraction/dependency-injection
      - ydk:req:extraction/format-extensibility
    acceptance:
      - "CFB detection component is resolved via the DI registry, not constructed inline in orchestration code"
      - "DetectMimeType dispatch tries both the OOXML and CFB structural checks via the registry and returns Unknown only when neither matches"
    depends_on:
      - "task-cfb-detect-core:blocks"
      - "task-cfb-detect-guardrails:blocks"
    # cross-sprint (Sprint 1, real ID, added post-creation): T-90924b6d:blocks
    test_strategy: "Unit-test-backed: a unit test confirms the CFB detection component is present in the registered set and is resolved by the dispatch mechanism without a hardcoded reference."

  # --- Epic 4: Legacy OLE Extraction — doc (story S-32677db6) ---
  - id: task-doc-open
    title: "Implement doc open component (NPOI HWPFDocument + FileMetadata)"
    story: S-32677db6
    description: >
      Implement the open component for legacy .doc via self-compiled NPOI
      (HWPFDocument), producing FileMetadata sourced from OLE
      SummaryInformation/DocumentSummaryInformation, registered through the
      DI dispatch registry.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/ExtractionResult
      - ydk:req:extraction/dependency-injection
    acceptance:
      - "Extract() on a .doc file opens successfully via NPOI HWPFDocument"
      - "FileMetadata is populated from OLE SummaryInformation/DocumentSummaryInformation, with fields the format doesn't provide left null (never a placeholder string)"
      - "The doc open component is resolved via the DI registry, not constructed inline"
    depends_on: []
    # cross-sprint (Sprint 1, real IDs, added post-creation): T-a5f1d074:blocks, T-90924b6d:blocks
    test_strategy: "Unit-test-backed: unit test opens a known .doc fixture and asserts each FileMetadata field against known values, including at least one null-source field."

  - id: task-doc-metadata
    title: "Map WordFormatMetadata for doc"
    story: S-32677db6
    description: >
      Populate WordFormatMetadata for legacy .doc from NPOI's
      SummaryInformation/DocumentSummaryInformation: page/word/character/
      paragraph/line counts, company/manager/template fields, and the
      macro-presence flag (VBA macro storage detection).
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/WordFormatMetadata
    acceptance:
      - "WordFormatMetadata's page/word/character/paragraph/line counts are populated from native metadata, not recomputed"
      - "Company/Manager/Template fields are populated when present, null when absent"
      - "HasMacros is true for a .doc fixture with a macro storage and false for one without"
    depends_on:
      - "task-doc-open:blocks"
    test_strategy: "Unit-test-backed: unit tests against a macro-enabled and a non-macro .doc fixture assert exact WordFormatMetadata field values including HasMacros."

  - id: task-doc-text
    title: "Implement doc flat-text extraction with unicode fidelity"
    story: S-32677db6
    description: >
      Extract flattened plain-text body content from .doc via NPOI, ensuring
      Hebrew/Arabic/Persian/Russian/Latin/CJK text and emoji (including
      multi-codepoint sequences) round-trip without mojibake, truncation, or
      unwanted normalization, per unicode-fidelity.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:req:extraction/unicode-fidelity
      - ydk:entity:extraction/ExtractionResult
    acceptance:
      - "ExtractedText is empty string (never null) for a .doc with no body text"
      - "ExtractedText for a multilingual .doc fixture matches the expected Unicode string exactly, byte-for-byte, per the NPOI i18n validation findings from T-94570c2b"
      - "No Unicode normalization form is applied that changes the source character sequence"
    depends_on:
      - "task-doc-open:blocks"
    # cross-sprint (Sprint 1, real ID, added post-creation): T-94570c2b:blocks
    test_strategy: "Corpus-sample-backed: unit test against a hand-crafted multilingual .doc fixture asserts ExtractedText exactly equals the known-correct string; formal corpus-manifest assertion lands with Epic 9's integration tests once Epic 8's corpus exists."

  - id: task-doc-subfiles
    title: "Implement doc first-layer embedded-subfile walk"
    story: S-32677db6
    description: >
      Walk the .doc CFB structure for first-layer OLE-embedded objects and
      inline media, producing SubfileItem entries per subfile-scope. A
      corrupt embedded object is omitted and logged without failing the
      overall extraction call.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "First-layer embedded objects and inline media in a .doc fixture appear as correct SubfileItem entries (Binary, FileName from CFB storage name, SizeBytes)"
      - "A subfile that is itself a container is returned as one opaque SubfileItem, not recursively unpacked"
      - "A single corrupt embedded object is omitted from Subfiles and logged; Extract() still returns successfully for the rest of the document"
    depends_on:
      - "task-doc-open:blocks"
    test_strategy: "Unit-test-backed: unit test against a .doc fixture with one valid and one corrupt embedded object asserts the valid one appears in Subfiles, the corrupt one is omitted and logged, and the call does not throw."

