      internal package XML parts per subfile-scope.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "A docx with an embedded xlsx object and an inline PNG both appear in Subfiles via the generalized walk"
      - "Internal package XML parts (styles.xml, theme*.xml, numbering.xml, settings.xml, docProps/*.xml, [Content_Types].xml, _rels/*) never appear in Subfiles"
      - "A single corrupt embedding is omitted from Subfiles and logged without failing the overall extraction call"
    depends_on: []
    # cross-sprint (Sprint 1, real ID, added post-creation): T-05bd14c7:blocks
    test_strategy: "Unit-test-backed: unit test against a docx fixture with an embedded xlsx, an inline image, and one corrupt embedding asserts correct SubfileItem entries and correct exclusions, per subfile-scope's acceptance_criteria."

