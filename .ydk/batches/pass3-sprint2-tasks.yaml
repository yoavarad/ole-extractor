      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/WordFormatMetadata
    acceptance:
      - "Extract() on a docx file returns full FileMetadata and WordFormatMetadata sourced from OOXML Core/Extended Properties"
      - "HasMacros is true for a docm fixture and false for a non-macro docx fixture"
      - "Fields absent from app.xml are null, not a placeholder string"
    depends_on: []
    # cross-sprint (Sprint 1, real ID, added post-creation): T-90924b6d:blocks
    test_strategy: "Unit-test-backed: unit tests against a macro-enabled and non-macro docx fixture assert exact FileMetadata/WordFormatMetadata field values."

  - id: task-docx-text
    title: "Implement docx flat-text extraction with unicode fidelity"
    story: S-156ec71a
