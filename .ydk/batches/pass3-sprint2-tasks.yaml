  # --- Epic 5: OOXML Mime Detection Hardening (story S-7d040ba7) ---
  - id: task-ooxml-detect-harden
    title: "Harden existing OOXML detection to be strictly content-only"
    story: S-7d040ba7
    description: >
      Audit and harden the existing ZIP/OOXML relationship-based detection
      component so it never reads request.FileName for classification
      decisions, only [Content_Types].xml / part-name structure, correctly
      handling a wrong- or missing-extension input.
    spec_refs:
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:req:extraction/content-only-mime-detection
    acceptance:
      - "A genuine .docx renamed to .txt (or with no extension) still detects as Docx"
      - "A genuine .txt renamed to .docx detects as Unknown, not Docx"
      - "Code review confirms the OOXML detection implementation never branches on FileName"
    depends_on: []
    # cross-sprint (Sprint 1, real ID, added post-creation): T-2ac2f140:blocks
    test_strategy: "Unit-test-backed: unit tests with a wrong-extension and a no-extension OOXML fixture, and a renamed-non-OOXML fixture, assert correct/Unknown classification independent of FileName."

  - id: task-ooxml-detect-macro-variants
    title: "Classify macro-enabled OOXML variants (docm/xlsm/pptm) as their base format"
    story: S-7d040ba7
    description: >
      Ensure the OOXML detection component structurally recognizes
      macro-enabled variants (docm/xlsm/pptm) but classifies DetectedFormat
      as the base format (Docx/Xlsx/Pptx), without growing the
      MimeDetectionResult enum with a parallel macro axis.
    spec_refs:
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:entity:extraction/MimeDetectionResult
    acceptance:
      - "A docm file detects as Docx; an xlsm file detects as Xlsx; a pptm file detects as Pptx"
      - "MimeDetectionResult.DetectedFormat gains no separate macro-variant enum values"
      - "The macro-presence distinction is not surfaced on MimeDetectionResult (it surfaces later on FormatMetadata via extraction, per Epic 6)"
    depends_on:
      - "task-ooxml-detect-harden:blocks"
    test_strategy: "Unit-test-backed: unit tests against a docm/xlsm/pptm fixture each assert DetectedFormat equals the base format's enum value."

  - id: task-ooxml-detect-zerobyte
    title: "Handle zero-byte input as Unknown in OOXML detection path"
    story: S-7d040ba7
    description: >
      Ensure a zero-length FileBytes input to the OOXML detection component
      returns the Unknown result rather than throwing, since there is no ZIP
      structure to inspect.
    spec_refs:
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:entity:extraction/MimeDetectionResult
    acceptance:
      - "A zero-byte FileBytes input returns DetectedFormat=Unknown, MimeType=application/octet-stream, IsSupported=false"
      - "No exception is thrown for zero-length input in the OOXML detection path"
    depends_on:
      - "task-ooxml-detect-harden:blocks"
    test_strategy: "Unit-test-backed: unit test with a zero-length byte array asserts the Unknown result, not an exception."

  # --- Epic 6: OOXML Extraction Completeness — docx (story S-156ec71a) ---
  - id: task-docx-metadata
    title: "Complete WordFormatMetadata parity for docx"
    story: S-156ec71a
    description: >
      Bring docx's WordFormatMetadata to full parity with doc's shape
      (page/word/character/paragraph/line counts, company/manager/template,
      macro-presence flag), sourced from OOXML Extended (app.xml) Properties.
