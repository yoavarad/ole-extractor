  # --- Epic 7: Public API Surface — DetectMimeType facade (story S-072bfdf6) ---
  - id: task-detect-facade-wire
    title: "Wire DetectMimeType facade to the OOXML + CFB detection registry"
    story: S-072bfdf6
    description: >
      Wire the public DetectMimeType(MimeDetectionRequest) facade to resolve
      and dispatch to both the OOXML and CFB detection components via the
      DI registry, returning MimeDetectionResult. The facade contains no
      format-specific parsing logic itself.
    spec_refs:
      - docs/specs/overview.md
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:entity:extraction/MimeDetectionRequest
      - ydk:entity:extraction/MimeDetectionResult
    acceptance:
      - "DetectMimeType dispatches to the registry-resolved OOXML and CFB detection components, returning Unknown only when neither matches"
      - "The public facade contains no format-specific parsing logic itself — it only orchestrates dispatch"
      - "The facade is a thin non-DI-aware entry point that internally resolves dependencies from the DI container"
    depends_on:
      - "task-cfb-detect-registry:blocks"
      - "task-ooxml-detect-harden:blocks"
      - "task-ooxml-detect-macro-variants:blocks"
      - "task-ooxml-detect-zerobyte:blocks"
    # cross-sprint (Sprint 1, real ID, added post-creation): T-90924b6d:blocks
    test_strategy: "Unit-test-backed: unit tests confirm DetectMimeType correctly dispatches to whichever registered component matches a given fixture (OOXML, CFB, or neither), with no mocking of the format-handling components themselves."

  - id: task-detect-facade-validation
    title: "Add null request/field boundary validation to DetectMimeType"
    story: S-072bfdf6
    description: >
      Add standard argument validation to the DetectMimeType facade so a null
      request object, or a null FileBytes, throws immediately before any
      detection logic runs — boundary validation, not a domain error.
    spec_refs:
      - docs/specs/overview.md
    component_refs:
      - ydk:entity:extraction/MimeDetectionRequest
    acceptance:
      - "A null MimeDetectionRequest throws immediately, before any detection component is invoked"
      - "A MimeDetectionRequest with a null FileBytes throws immediately, before any detection component is invoked"
    depends_on:
      - "task-detect-facade-wire:blocks"
    test_strategy: "Unit-test-backed: unit tests assert a null request and a null FileBytes each throw before any detection component executes, verified via a spy/counter on the registry."

  # --- Epic 7: Public API Surface — Extract facade + errors (story S-51d277f1) ---
  - id: task-extract-facade-wire
    title: "Wire Extract facade to the format-dispatch registry (open + text-extraction)"
    story: S-51d277f1
    description: >
      Wire the public Extract(ExtractionRequest) facade to resolve and
      dispatch to the open and text-extraction components for all six
      formats via the DI registry, based on DetectedMimeType, returning
      ExtractionResult. Extract() trusts the caller-supplied DetectedMimeType
      rather than re-detecting.
    spec_refs:
      - docs/specs/overview.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:contract:extraction/extract
      - ydk:entity:extraction/ExtractionRequest
      - ydk:entity:extraction/ExtractionResult
      - ydk:req:extraction/format-extensibility
    acceptance:
      - "Extract() dispatches to the correct open + text-extraction components for each of the six supported formats via the registry"
      - "Extract() does not re-detect the mime type; it uses DetectedMimeType as-is"
      - "The public facade contains no format-specific parsing logic itself"
    depends_on:
      - "task-doc-subfiles:blocks"
      - "task-xls-subfiles:blocks"
      - "task-ppt-subfiles:blocks"
      - "task-docx-subfiles:blocks"
      - "task-xlsx-subfiles:blocks"
      - "task-pptx-subfiles:blocks"
    # cross-sprint (Sprint 1, real ID, added post-creation): T-90924b6d:blocks
    test_strategy: "Unit-test-backed: unit tests confirm Extract() dispatches correctly for a fixture of each of the six formats, with no mocking of the format-handling components themselves."

  - id: task-extract-facade-guardrail-errors
    title: "Implement pre-parse guardrail errors in Extract (file-too-large, oversized-nested-content)"
    story: S-51d277f1
    description: >
      Implement file-too-large and oversized-nested-content error handling in
      the Extract facade, both checked before any parsing or buffer
      allocation begins, per max-file-size and nesting-depth-guard.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:error:extraction/file-too-large
      - ydk:error:extraction/oversized-nested-content
      - ydk:nfr:extraction/max-file-size
      - ydk:nfr:extraction/nesting-depth-guard
    acceptance:
      - "Extract() raises file-too-large before any parsing when FileBytes exceeds the configured max-file-size limit"
      - "Extract() raises oversized-nested-content when declared internal size/nesting exceeds nesting-depth-guard caps, checked before buffer allocation"
      - "Both rejections are logged with file size, filename, and configured limit, per max-file-size's monitoring requirement"
    depends_on:
      - "task-extract-facade-wire:blocks"
    test_strategy: "Unit-test-backed: unit test with a synthetic 100MB+1byte input asserts file-too-large before any format-specific parsing runs, verified via a spy/counter; synthetic crafted inputs with implausible declared sizes assert oversized-nested-content, per nesting-depth-guard's test_method."

  - id: task-extract-facade-parse-errors
    title: "Implement parse-time error handling in Extract (password-protected, corrupt-file, truncated-container)"
    story: S-51d277f1
    description: >
      Implement password-protected, corrupt-file, and truncated-container
      error handling in the Extract facade: encryption detected before a
      full parse, unparseable-but-present structure, and declared-vs-actual
      byte mismatch or zero-length input respectively.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:error:extraction/password-protected
      - ydk:error:extraction/corrupt-file
      - ydk:error:extraction/truncated-container
    acceptance:
      - "Extract() raises password-protected when an EncryptionInfo/EncryptedPackage stream is detected, or the backing library throws an encrypted-document exception, before a full parse completes"
      - "Extract() raises corrupt-file when the container structure is present but unparseable by NPOI or DocumentFormat.OpenXml"
      - "Extract() raises truncated-container when declared container size exceeds actual byte length, or when FileBytes is zero-length"
    depends_on:
      - "task-extract-facade-wire:blocks"
    test_strategy: "Unit-test-backed: unit tests with a password-protected fixture, a structurally-corrupt fixture, a byte-truncated fixture, and a zero-length input each assert the correct specific error type is raised, not a generic exception."

  - id: task-extract-facade-unsupported-and-validation
    title: "Implement unsupported-format rejection and null-argument validation in Extract"
    story: S-51d277f1
    description: >
      Implement unsupported-format error handling for a DetectedMimeType
      that isn't one of the six supported formats, and standard argument
      validation so a null request or null required field throws immediately
      before any detection/extraction logic runs.
    spec_refs:
      - docs/specs/extraction.md
      - docs/specs/overview.md
    component_refs:
      - ydk:error:extraction/unsupported-format
      - ydk:entity:extraction/ExtractionRequest
    acceptance:
      - "Extract() raises unsupported-format when DetectedMimeType isn't one of the six supported mime types (including the Unknown sentinel application/octet-stream)"
      - "A null ExtractionRequest throws immediately, before any of the above logic runs"
      - "An ExtractionRequest with a null required field (FileBytes, FileName, or DetectedMimeType) throws immediately, before any of the above logic runs"
    depends_on:
      - "task-extract-facade-wire:blocks"
    test_strategy: "Unit-test-backed: unit tests assert unsupported-format for an arbitrary/Unknown mime string, and assert a null request and each null required field throw before any detection/extraction logic executes, verified via a spy/counter."
