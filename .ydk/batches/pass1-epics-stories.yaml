epics:
  - id: epic-01-library-setup
    title: "Library Setup & Validation"
    description: >
      Wire the ADR-001-locked libraries (self-compiled NPOI, OpenMcdf>=3.1.3,
      DocumentFormat.OpenXml already present) into the build, and empirically
      validate the flagged-as-unverified NPOI Unicode/i18n fidelity on the
      legacy OLE read path against real multilingual samples. Does not
      re-research library choice -- ADR-001/002 already lock that decision;
      this epic is the remaining engineering work to make the picks real and
      trustworthy.
    spec_refs:
      - docs/adrs/001-extraction-library-stack.md
      - docs/project-rules.md

  - id: epic-02-project-restructure
    title: "Project Restructure"
    description: >
      Downgrade ExtractorOLE.csproj from net10.0 to net8.0 (deliberate
      choice), fix the OfficeMimeTypeEnum typo, generalize the
      PowerPoint-special-cased embedded-subfile walk, wire a DI registry
      pattern for extensible format dispatch, and make Program.cs actually
      invoke the two public functions against a real file.
    spec_refs:
      - docs/specs/overview.md
      - docs/project-rules.md

  - id: epic-03-cfb-mime-detection
    title: "CFB / Legacy Mime Detection"
    description: >
      Implement content-only detection for legacy doc/xls/ppt via CFB
      directory-entry inspection (OpenMcdf), dispatched alongside the
      existing OOXML structural check, per mime-detection.md.
    spec_refs:
      - docs/specs/mime-detection.md

  - id: epic-04-legacy-ole-extraction
    title: "Legacy OLE Extraction"
    description: >
      Implement open + text-extraction components for doc/xls/ppt via
      self-compiled NPOI, producing FileMetadata, format-specific metadata,
      flat text, and first-layer subfiles per extraction.md.
    spec_refs:
      - docs/specs/extraction.md

  - id: epic-05-ooxml-mime-detection
    title: "OOXML Mime Detection Hardening"
    description: >
      Harden the existing ZIP/OOXML relationship-based detection to be
      fully content-only and correctly handle macro-enabled variants
      (docm/xlsm/pptm) per mime-detection.md's Macro-Enabled Variants design.
    spec_refs:
      - docs/specs/mime-detection.md

  - id: epic-06-ooxml-extraction
    title: "OOXML Extraction Completeness"
    description: >
      Bring docx/xlsx/pptx extraction to completeness -- full metadata
      parity, generalized embeddings/media walk (built on the Epic 2
      generalization), and unicode-fidelity text extraction -- per
      extraction.md.
    spec_refs:
      - docs/specs/extraction.md

  - id: epic-07-public-api
    title: "Public API Surface"
    description: >
      Wire the two public facade functions (DetectMimeType, Extract) to the
      format-dispatch registry, with full explicit error handling for all
      six error manifests, per overview.md and extraction.md.
    spec_refs:
      - docs/specs/overview.md
      - docs/specs/extraction.md

  - id: epic-08-dataset-curation
    title: "Dataset Curation"
    description: >
      Build the synthetic sample generator (3 per format), curate
      real-world-style samples (2 per format), assemble the shared 7-item
      adversarial set, and produce the corpus manifest that the test suite
      asserts against, per dataset-curation.md.
    spec_refs:
      - docs/specs/dataset-curation.md

  - id: epic-09-test-suite
    title: "Test Suite"
    description: >
      Integration tests against the corpus manifest and unit tests for
      unit-test-backed scenarios, covering every non-out-of-scope
      adversarial scenario in overview.md via the three-mechanism coverage
      rule in testing-strategy.md.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/specs/overview.md

  - id: epic-10-time-profiling
    title: "Time Profiling"
    description: >
      BenchmarkDotNet project measuring Extract() latency and memory
      allocation per format against fixed corpus samples, per ADR-002 and
      the extraction-latency/memory-ceiling NFRs.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/adrs/002-profiling-and-stress-testing.md

  - id: epic-11-stress-harness
    title: "Stress Test Harness"
    description: >
      Hand-rolled concurrent-load harness (at least 50 concurrent calls) to
      both public functions per ADR-002 and testing-strategy.md, reporting
      throughput/latency/memory under load.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/adrs/002-profiling-and-stress-testing.md

stories:
  - id: story-01-npoi-openmcdf-build
    title: "Wire self-compiled NPOI and OpenMcdf into the build"
    epic: epic-01-library-setup
    description: >
      Add OpenMcdf>=3.1.3 as a package reference and set up a self-compiled
      NPOI build (Apache-2.0 source, not the paid-EULA precompiled NuGet
      package) referenced from ExtractorOLE.csproj, per ADR-001.
    spec_refs:
      - docs/adrs/001-extraction-library-stack.md
      - docs/project-rules.md
    acceptance:
      - "ExtractorOLE.csproj references OpenMcdf pinned to >=3.1.3"
      - "NPOI is compiled from its own Apache-2.0 source and referenced as an assembly/project reference, not the precompiled NuGet package"
      - "dotnet build ExtractorOLE.slnx succeeds with both libraries referenced"

  - id: story-01-npoi-i18n-validation
    title: "Empirically validate NPOI i18n fidelity on the legacy OLE path"
    epic: epic-01-library-setup
    description: >
      Test NPOI's Unicode/RTL/CJK/emoji text and metadata extraction against
      1-2 real multilingual legacy OLE samples, resolving the "unverified"
      flag in ADR-001 and docs/project-rules.md before Epic 4 depends on it.
    spec_refs:
      - docs/specs/extraction.md
      - docs/project-rules.md
      - docs/adrs/001-extraction-library-stack.md
    component_refs:
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "At least 1 legacy OLE sample with non-Latin script text (Hebrew, Arabic, or CJK) is read via NPOI and the extracted text matches the known-correct string exactly"
      - "Pass/fail per script family tested is recorded in docs/project-rules.md or a short ADR addendum, resolving the 'unverified' status"
      - "Any fidelity gap found is documented with its impact on Epic 4 scope before Epic 4 starts"

  - id: story-02-net8-and-enum-fix
    title: "Downgrade to net8.0 and fix enum typo"
    epic: epic-02-project-restructure
    description: >
      Change ExtractorOLE.csproj's TargetFramework from net10.0 to net8.0
      (deliberate choice per docs/project-rules.md) and fix the
      OfficeMimeTypeEnum "OpenXmlUnkown" typo, updating all references.
    spec_refs:
      - docs/project-rules.md
    component_refs:
      - ydk:entity:extraction/MimeDetectionResult
    acceptance:
      - "ExtractorOLE.csproj TargetFramework is net8.0 and dotnet build succeeds"
      - "OfficeMimeTypeEnum no longer contains the 'OpenXmlUnkown' typo anywhere in the codebase"

  - id: story-02-di-registry-and-embedded-walk
    title: "Generalize embedded-subfile walk and wire DI registry for format dispatch"
    epic: epic-02-project-restructure
    description: >
      Generalize ExtractionHelper's PowerPoint-special-cased embedded-subfile
      walk to work uniformly across format kinds, and wire a DI-registered
      registry pattern for extensible format dispatch per
      ydk:req:extraction/format-extensibility and
      ydk:req:extraction/dependency-injection.
    spec_refs:
      - docs/specs/overview.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:req:extraction/format-extensibility
      - ydk:req:extraction/dependency-injection
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "ExtractFirstLayerEmbedded contains no PowerPoint-specific branching; the same code path handles Word/Excel/PowerPoint OOXML embeddings"
      - "Format dispatch (detection/open/text-extraction) is resolved via a DI-registered registry keyed by format, not a hardcoded switch/if-chain"
      - "A new format could be added by registering new components without modifying the core dispatch method (verified by code review)"

  - id: story-02-program-cs-wiring
    title: "Wire Program.cs to invoke both public functions on a real file"
    epic: epic-02-project-restructure
    description: >
      Update Program.cs so it actually calls the detect and extract entry
      points against a real file on disk and prints/logs real output,
      replacing any placeholder/no-op behavior.
    spec_refs:
      - docs/specs/overview.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:contract:extraction/extract
    acceptance:
      - "Running the ExtractorOLE console app against a real sample file prints real, non-placeholder detection and extraction output"
      - "Program.cs invokes detection then extraction in sequence"

  - id: story-03-cfb-detection
    title: "CFB directory-based detection for legacy formats"
    epic: epic-03-cfb-mime-detection
    description: >
      Implement a CFB/compound-file detection component (via OpenMcdf) that
      inspects directory-entry structure to distinguish doc/xls/ppt without a
      full document parse, dispatched alongside the existing OOXML check.
    spec_refs:
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:entity:extraction/MimeDetectionRequest
      - ydk:entity:extraction/MimeDetectionResult
      - ydk:req:extraction/content-only-mime-detection
      - ydk:nfr:extraction/max-file-size
      - ydk:nfr:extraction/nesting-depth-guard
    acceptance:
      - "A CFB detection component distinguishes doc/xls/ppt by inspecting CFB directory entries only, with no full document parse"
      - "Detection never reads request.FileName to decide the result"
      - "A file matching neither the ZIP/OOXML nor the CFB structural check returns the Unknown result, never an exception"
      - "max-file-size and nesting-depth-guard checks run before any declared-size inspection"

  - id: story-04-doc-extraction
    title: "doc extraction (Word legacy)"
    epic: epic-04-legacy-ole-extraction
    description: >
      Implement the open and text-extraction components for legacy .doc via
      NPOI, producing FileMetadata, WordFormatMetadata, flat text, and
      first-layer subfiles.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/WordFormatMetadata
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/subfile-scope
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "Extract() on a .doc file returns FileMetadata sourced from OLE SummaryInformation/DocumentSummaryInformation"
      - "WordFormatMetadata is populated including the macro-presence flag"
      - "Flat text is empty (never null) when there is no text, and round-trips Hebrew/Arabic/Russian/CJK/emoji"
      - "First-layer embedded objects and inline media appear as correct SubfileItem entries"
      - "A single corrupt embedded object is omitted and logged without failing the overall extraction call"

  - id: story-04-xls-extraction
    title: "xls extraction (Excel legacy)"
    epic: epic-04-legacy-ole-extraction
    description: >
      Implement the open and text-extraction components for legacy .xls via
      NPOI, producing FileMetadata, ExcelFormatMetadata, flat text, and
      first-layer subfiles.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/ExcelFormatMetadata
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/subfile-scope
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "Extract() on an .xls file returns FileMetadata sourced from OLE SummaryInformation/DocumentSummaryInformation"
      - "ExcelFormatMetadata is populated (sheet count/names, active sheet, macro-presence flag)"
      - "Flat text round-trips Hebrew/Arabic/Russian/CJK/emoji with no mojibake or truncation"
      - "First-layer embedded objects and inline media appear as correct SubfileItem entries"
      - "A single corrupt embedded object is omitted and logged without failing the overall extraction call"

  - id: story-04-ppt-extraction
    title: "ppt extraction (PowerPoint legacy)"
    epic: epic-04-legacy-ole-extraction
    description: >
      Implement the open and text-extraction components for legacy .ppt via
      NPOI, producing FileMetadata, PowerPointFormatMetadata, flat text, and
      first-layer subfiles.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/PowerPointFormatMetadata
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/subfile-scope
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "Extract() on a .ppt file returns FileMetadata sourced from OLE SummaryInformation/DocumentSummaryInformation"
      - "PowerPointFormatMetadata is populated (slide count, notes-slide count, macro-presence flag)"
      - "Flat text round-trips Hebrew/Arabic/Russian/CJK/emoji with no mojibake or truncation"
      - "First-layer embedded objects and inline media appear as correct SubfileItem entries"
      - "A single corrupt embedded object is omitted and logged without failing the overall extraction call"

  - id: story-05-ooxml-detection-hardening
    title: "Harden OOXML detection, including macro-enabled variants"
    epic: epic-05-ooxml-mime-detection
    description: >
      Harden the existing ZIP/OOXML relationship-based detection to be
      strictly content-only and correctly classify macro-enabled variants
      (docm/xlsm/pptm) as their base format per mime-detection.md.
    spec_refs:
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:req:extraction/content-only-mime-detection
    acceptance:
      - "A docm/xlsm/pptm file detects as Docx/Xlsx/Pptx respectively, not a separate enum value"
      - "A wrong-extension test case (e.g. a docx renamed to .txt) still detects as Docx, proving FileName is never a factor"
      - "A zero-byte file returns the Unknown result, not an exception or error"

  - id: story-06-docx-extraction
    title: "docx extraction completeness"
    epic: epic-06-ooxml-extraction
    description: >
      Bring docx extraction to completeness: full WordFormatMetadata parity,
      generalized embeddings/media walk (from Epic 2), and unicode-fidelity
      flat text.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/WordFormatMetadata
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "Extract() on a docx file returns full FileMetadata and WordFormatMetadata including macro-presence flag"
      - "Flat text round-trips Hebrew/Arabic/Russian/CJK/emoji with no mojibake or truncation"
      - "First-layer embedded objects and inline media appear as correct SubfileItem entries via the generalized walk"

  - id: story-06-xlsx-extraction
    title: "xlsx extraction completeness"
    epic: epic-06-ooxml-extraction
    description: >
      Bring xlsx extraction to completeness: full ExcelFormatMetadata parity,
      generalized embeddings/media walk (from Epic 2), and unicode-fidelity
      flat text.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/ExcelFormatMetadata
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "Extract() on an xlsx file returns full FileMetadata and ExcelFormatMetadata (sheet count/names, active sheet, macro-presence flag)"
      - "Flat text round-trips Hebrew/Arabic/Russian/CJK/emoji with no mojibake or truncation"
      - "First-layer embedded objects and inline media appear as correct SubfileItem entries via the generalized walk"

  - id: story-06-pptx-extraction
    title: "pptx extraction completeness"
    epic: epic-06-ooxml-extraction
    description: >
      Bring pptx extraction to completeness: full PowerPointFormatMetadata
      parity, generalized embeddings/media walk (from Epic 2), and
      unicode-fidelity flat text.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:entity:extraction/FileMetadata
      - ydk:entity:extraction/PowerPointFormatMetadata
      - ydk:entity:extraction/SubfileItem
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "Extract() on a pptx file returns full FileMetadata and PowerPointFormatMetadata (slide count, notes-slide count, macro-presence flag)"
      - "Flat text round-trips Hebrew/Arabic/Russian/CJK/emoji with no mojibake or truncation"
      - "First-layer embedded objects and inline media appear as correct SubfileItem entries via the generalized walk"

  - id: story-07-detect-mime-facade
    title: "Wire the DetectMimeType public facade to the registry"
    epic: epic-07-public-api
    description: >
      Wire the public DetectMimeType(MimeDetectionRequest) facade to the
      format-dispatch registry (both OOXML and CFB detection components),
      returning MimeDetectionResult.
    spec_refs:
      - docs/specs/overview.md
      - docs/specs/mime-detection.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:entity:extraction/MimeDetectionRequest
      - ydk:entity:extraction/MimeDetectionResult
    acceptance:
      - "DetectMimeType dispatches to the registry-resolved detection component per format family"
      - "A null request or null FileBytes throws immediately before any detection logic runs"
      - "The public facade contains no format-specific parsing logic itself"

  - id: story-07-extract-facade-errors
    title: "Wire the Extract public facade with full error handling"
    epic: epic-07-public-api
    description: >
      Wire the public Extract(ExtractionRequest) facade to the format-dispatch
      registry (open + text-extraction components), returning
      ExtractionResult, with explicit handling for all six error manifests.
    spec_refs:
      - docs/specs/overview.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:contract:extraction/extract
      - ydk:entity:extraction/ExtractionRequest
      - ydk:entity:extraction/ExtractionResult
      - ydk:error:extraction/corrupt-file
      - ydk:error:extraction/file-too-large
      - ydk:error:extraction/oversized-nested-content
      - ydk:error:extraction/password-protected
      - ydk:error:extraction/truncated-container
      - ydk:error:extraction/unsupported-format
    acceptance:
      - "Extract() raises file-too-large before any parsing when input exceeds the configured max-file-size limit"
      - "Extract() raises password-protected when encryption is detected before a full parse"
      - "Extract() raises unsupported-format when DetectedMimeType isn't one of the six supported formats"
      - "Extract() raises truncated-container on declared-vs-actual byte mismatch or zero-length input"
      - "Extract() raises corrupt-file when the container is present but unparseable"
      - "Extract() raises oversized-nested-content when declared internal size exceeds nesting-depth-guard caps, checked before buffer allocation"
      - "A null request or null required field throws immediately before any of the above logic runs"

  - id: story-08-synthetic-generator
    title: "Synthetic sample generator (3 per format)"
    epic: epic-08-dataset-curation
    description: >
      Build a programmatic generator producing 3 synthetic complex samples
      per format across all 6 formats: multi-embedding, 100k+ word body, and
      macro-enabled-with-embedding, each with multilingual/emoji content in
      body text and 2+ metadata fields.
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:req:extraction/unicode-fidelity
      - ydk:req:extraction/subfile-scope
    acceptance:
      - "18 synthetic samples exist (3 per format x 6 formats) per dataset-curation.md's Corpus Composition rule 1"
      - "Every synthetic sample includes multilingual/mixed-script text and emoji in both body text and at least 2 metadata fields"
      - "Each synthetic sample's exact expected mime type, exact expected text/metadata strings, and exact expected subfile count+filenames are recorded in samples/manifest.json"

  - id: story-08-curated-samples
    title: "Curated real-world samples (2 per format)"
    epic: epic-08-dataset-curation
    description: >
      Curate 2 real-world-style samples per format (self-authored or
      public-domain/OSS with recorded license): at least one with 2+ levels
      of nested embedding, at least one with a real multi-user/multi-save
      revision-history chain.
    spec_refs:
      - docs/specs/dataset-curation.md
    acceptance:
      - "12 curated samples exist (2 per format x 6 formats)"
      - "At least one curated sample has 2+ levels of nested embedding"
      - "At least one curated sample carries a real (not scripted) multi-user authorship/revision-history property chain"
      - "Every curated sample is tagged self-generated vs. third-party in samples/manifest.json, with license recorded for third-party samples"

  - id: story-08-adversarial-set
    title: "Shared adversarial set and corpus manifest"
    epic: epic-08-dataset-curation
    description: >
      Produce the 7-item shared adversarial set (corrupt, truncated,
      zero-byte, oversized/bomb, password-protected, wrong-extension,
      corrupt-embedded-object) tagged by target format(s), and finalize
      samples/manifest.json as the ground-truth corpus manifest.
    spec_refs:
      - docs/specs/dataset-curation.md
      - docs/specs/overview.md
    component_refs:
      - ydk:error:extraction/corrupt-file
      - ydk:error:extraction/truncated-container
      - ydk:error:extraction/oversized-nested-content
      - ydk:error:extraction/password-protected
      - ydk:nfr:extraction/nesting-depth-guard
    acceptance:
      - "The shared adversarial set contains one corrupt, one truncated, one zero-byte, one oversized-declared-size, one password-protected, one wrong-extension, and one corrupt-embedded-object sample, each tagged with target format(s)"
      - "samples/manifest.json records, per sample: format, which composition rule it satisfies, expected detected format, and exact expected content/subfile fields where applicable"
      - "A sample without a manifest entry does not count toward corpus coverage"

  - id: story-09-integration-tests
    title: "Integration tests against the corpus manifest"
    epic: epic-09-test-suite
    description: >
      Integration test suite exercising both public functions end-to-end
      against every corpus sample, asserting exact expected
      format/text/metadata/subfile-list from samples/manifest.json.
    spec_refs:
      - docs/specs/testing-strategy.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:contract:extraction/extract
    acceptance:
      - "Every corpus sample in samples/manifest.json has a corresponding integration test asserting exact expected mime type"
      - "No test asserts only 'text is non-empty' where the manifest records an exact expected string"
      - "No format-handling component is mocked in these tests"
      - "Every corpus-sample-backed adversarial scenario from overview.md has a passing test"

  - id: story-09-unit-tests
    title: "Unit tests for unit-test-backed scenarios"
    epic: epic-09-test-suite
    description: >
      Unit tests for scenarios that don't need a checked-in sample: null
      request/field validation on both public functions, and file-too-large
      using a synthetic oversized byte-array length.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/specs/extraction.md
    component_refs:
      - ydk:nfr:extraction/max-file-size
    acceptance:
      - "A null request object and a null required field on each public function throws immediately, before any detection/extraction logic runs"
      - "A synthetic 100MB+1byte input triggers file-too-large before any format-specific parsing runs, verified via a spy/counter"
      - "The max-file-size limit is verified to be read from configuration, not hardcoded"

  - id: story-10-benchmark-project
    title: "BenchmarkDotNet profiling project"
    epic: epic-10-time-profiling
    description: >
      Separate BenchmarkDotNet project measuring Extract() latency and
      memory allocation per format against fixed 10MB and ~100MB corpus
      samples, per ADR-002 and the extraction-latency/memory-ceiling NFRs.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/adrs/002-profiling-and-stress-testing.md
    component_refs:
      - ydk:nfr:extraction/extraction-latency
      - ydk:nfr:extraction/memory-ceiling
    acceptance:
      - "BenchmarkDotNet project runs Extract() against a fixed 10MB and a fixed ~100MB sample for each of the 6 formats, reporting P50/P95 and allocations"
      - "Benchmark run is separate from the unit/integration test suite gate"
      - "Report compares against a committed baseline, documenting what a >20% P95 regression means for CI"

  - id: story-11-stress-harness
    title: "Concurrent-load stress harness"
    epic: epic-11-stress-harness
    description: >
      Hand-rolled console harness (Parallel.ForEachAsync/SemaphoreSlim +
      Stopwatch, per ADR-002) exercising at least 50 concurrent calls to
      both public functions, reporting throughput/latency/memory under load.
    spec_refs:
      - docs/specs/testing-strategy.md
      - docs/adrs/002-profiling-and-stress-testing.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:contract:extraction/extract
    acceptance:
      - "Harness exercises at least 50 concurrent calls to DetectMimeType and Extract, configurable higher for extended runs"
      - "Harness reports throughput, latency, and memory under load"
      - "Run confirms no shared-mutable-state issue across concurrent calls on the same/different files"
      - "Not wired into the standard test suite gate; runs manually or as a longer CI job"
