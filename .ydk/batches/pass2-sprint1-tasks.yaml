tasks:
  - id: task-net8-downgrade
    title: "Downgrade ExtractorOLE.csproj to net8.0"
    story: S-d01346bc
    description: >
      Change TargetFramework from net10.0 to net8.0 in
      ExtractorOLE/ExtractorOLE.csproj per the deliberate downgrade decision
      recorded in docs/project-rules.md; confirm the project still builds and
      that existing NuGet package versions (DocumentFormat.OpenXml,
      Microsoft.Extensions.DependencyInjection) remain compatible with
      net8.0.
    spec_refs:
      - docs/project-rules.md
    acceptance:
      - "ExtractorOLE.csproj TargetFramework element is net8.0"
      - "dotnet build ExtractorOLE.slnx succeeds with no new warnings/errors introduced by the framework change"
      - "Existing package references remain compatible with net8.0 (no forced downgrade required, or documented if one is)"
    depends_on: []
    test_strategy: "Manual verification: dotnet build ExtractorOLE.slnx from a clean checkout succeeds with exit code 0."

  - id: task-fix-enum-typo
    title: "Fix OfficeMimeTypeEnum typo (OpenXmlUnkown)"
    story: S-d01346bc
    description: >
      Rename the misspelled OpenXmlUnkown enum value in
      ExtractorOLE/DTOs/OfficeMimeTypeEnum.cs to a correctly-spelled name and
      update every reference across the codebase (MainExtractor,
      ExtractionHelper, etc.).
    component_refs:
      - ydk:entity:extraction/MimeDetectionResult
    acceptance:
      - "OfficeMimeTypeEnum.cs no longer contains 'OpenXmlUnkown' anywhere"
      - "All call sites referencing the old enum value name compile against the corrected name"
      - "dotnet build succeeds after the rename"
    depends_on:
      - "task-net8-downgrade:blocks"
    test_strategy: "Unit-test-backed: a unit test referencing the enum by its corrected name compiles and passes; grep confirms zero remaining occurrences of the typo."

  - id: task-openmcdf-package-ref
    title: "Add OpenMcdf >=3.1.3 package reference"
    story: S-e496f356
    description: >
      Add an OpenMcdf NuGet package reference pinned to >=3.1.3 to
      ExtractorOLE.csproj, per ADR-001 and the directory-cycle DoS CVE
      gotcha recorded in docs/project-rules.md.
    spec_refs:
      - docs/adrs/001-extraction-library-stack.md
      - docs/project-rules.md
    acceptance:
      - "ExtractorOLE.csproj references OpenMcdf with version >=3.1.3"
      - "dotnet build succeeds with the new package reference"
      - "No transitive package resolution can silently drop below 3.1.3"
    depends_on:
      - "task-net8-downgrade:blocks"
    test_strategy: "Manual verification: dotnet build succeeds; dotnet list package shows OpenMcdf resolved to >=3.1.3."

  - id: task-npoi-self-compile
    title: "Self-compile NPOI from Apache-2.0 source and reference it"
    story: S-e496f356
    description: >
      Set up a build step that compiles NPOI from its Apache-2.0 source (not
      the precompiled NuGet package, which carries a paid-maintenance EULA
      at 2.8.0+) and reference the resulting assembly/project from
      ExtractorOLE.csproj, per ADR-001.
    spec_refs:
      - docs/adrs/001-extraction-library-stack.md
      - docs/project-rules.md
    acceptance:
      - "NPOI is built from its own Apache-2.0-licensed source, not consumed as the precompiled NuGet package"
      - "ExtractorOLE.csproj references the self-compiled NPOI assembly/project"
      - "dotnet build ExtractorOLE.slnx succeeds and NPOI types are importable from the extraction library"
    depends_on:
      - "task-net8-downgrade:blocks"
    test_strategy: "Manual verification: dotnet build succeeds; a smoke-test line of code referencing an NPOI type (e.g. NPOI.HPSF or NPOI.POIFS) compiles."

  - id: task-verify-library-build
    title: "Verify combined NPOI + OpenMcdf build"
    story: S-e496f356
    description: >
      Confirm ExtractorOLE.slnx builds cleanly with both self-compiled NPOI
      and OpenMcdf>=3.1.3 referenced together, closing out the build-wiring
      half of the Library Setup & Validation epic.
    spec_refs:
      - docs/adrs/001-extraction-library-stack.md
    acceptance:
      - "dotnet build ExtractorOLE.slnx succeeds with both libraries referenced simultaneously"
      - "No version or assembly-binding conflicts between NPOI's and OpenMcdf's dependency trees"
    depends_on:
      - "task-openmcdf-package-ref:blocks"
      - "task-npoi-self-compile:blocks"
    test_strategy: "Manual verification: clean dotnet build from a fresh checkout succeeds with exit code 0."

  - id: task-npoi-i18n-validation
    title: "Empirically validate NPOI Unicode/i18n fidelity on the legacy OLE path"
    story: S-418e5f1b
    description: >
      Test NPOI's text/metadata extraction against 1-2 real multilingual
      samples (Hebrew/Arabic/CJK at minimum) on the legacy doc/xls/ppt read
      path, since this is flagged unverified in ADR-001 and
      docs/project-rules.md. Must complete before Epic 4 (Legacy OLE
      Extraction) relies on NPOI's i18n fidelity.
    spec_refs:
      - docs/specs/extraction.md
      - docs/project-rules.md
      - docs/adrs/001-extraction-library-stack.md
    component_refs:
      - ydk:req:extraction/unicode-fidelity
    acceptance:
      - "At least 1 legacy OLE sample containing non-Latin script text is read via self-compiled NPOI and the extracted text is compared exactly against the known-correct string"
      - "Pass/fail per script family tested is recorded in docs/project-rules.md (updating the 'unverified' gotcha) or a short ADR addendum"
      - "Any fidelity gap found is documented with its impact on Epic 4 scope before that epic starts"
    depends_on:
      - "task-verify-library-build:blocks"
    test_strategy: "Corpus-sample-backed: at least one ad-hoc multilingual legacy sample (hand-crafted ahead of the full Dataset Curation epic) is read via NPOI and asserted byte-exact against a known string, documented as a manual or automated check."

  - id: task-generalize-embedded-walk
    title: "Generalize embedded-subfile walk beyond PowerPoint special-casing"
    story: S-43c41d4a
    description: >
      Refactor ExtractionHelper.ExtractFirstLayerEmbedded so the
      embedded-subfile walk works uniformly across Word/Excel/PowerPoint
      OOXML documents instead of being PowerPoint-special-cased.
    spec_refs:
      - docs/specs/extraction.md
    component_refs:
      - ydk:req:extraction/subfile-scope
      - ydk:entity:extraction/SubfileItem
    acceptance:
      - "ExtractFirstLayerEmbedded contains no PowerPoint-specific branching; the same logic path handles docx/xlsx/pptx embeddings"
      - "Existing PowerPoint embedded-subfile extraction behavior is preserved (no regression) after generalization"
      - "Word and Excel OOXML documents with embedded objects produce correct SubfileItem entries via the same code path"
    depends_on:
      - "task-net8-downgrade:blocks"
      - "task-fix-enum-typo:blocks"
    test_strategy: "Unit-test-backed: unit tests for ExtractFirstLayerEmbedded against a docx, an xlsx, and a pptx sample each containing at least one embedding, asserting correct SubfileItem count/filenames from the shared code path."

  - id: task-wire-di-registry
    title: "Wire DI registry pattern for extensible format dispatch"
    story: S-43c41d4a
    description: >
      Implement a DI-registered registry pattern for format dispatch
      (detection/open/text-extraction components keyed by format) per
      ydk:req:extraction/format-extensibility and
      ydk:req:extraction/dependency-injection, replacing MainExtractor's
      current FindOpenStrategyForMime/FindHandlerForMime hardcoded lookups.
    spec_refs:
      - docs/specs/overview.md
    component_refs:
      - ydk:req:extraction/format-extensibility
      - ydk:req:extraction/dependency-injection
    acceptance:
      - "Format dispatch is resolved via a DI-registered registry keyed by format, not a hardcoded switch/if-chain"
      - "MainExtractor's dispatch logic depends only on IOpenStrategy/ITextExtractor interfaces, never a specific backing library directly"
      - "All registered components are confirmed stateless/thread-safe (code review checklist item)"
    depends_on:
      - "task-generalize-embedded-walk:blocks"
    test_strategy: "Unit-test-backed: a unit test registers a fake/test format component in the DI container and confirms it's resolved via the registry without modifying MainExtractor's dispatch code."

  - id: task-program-cs-invoke
    title: "Wire Program.cs to invoke both public functions on a real file"
    story: S-fe24ecff
    description: >
      Update Program.cs so it actually calls the current detect/extract
      entry points against a real file on disk and prints/logs the result,
      replacing any placeholder/no-op behavior.
    spec_refs:
      - docs/specs/overview.md
    component_refs:
      - ydk:contract:extraction/detect-mime-type
      - ydk:contract:extraction/extract
    acceptance:
      - "Running the ExtractorOLE console app against a real sample file produces real, non-placeholder detection and extraction output"
      - "Program.cs invokes detection then extraction in sequence"
    depends_on:
      - "task-wire-di-registry:blocks"
    test_strategy: "Manual verification: run the console app against a checked-in or ad-hoc real Office file and confirm real output on stdout."
