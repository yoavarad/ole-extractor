$schema: ydk:schema:entity
id: ydk:entity:extraction/FieldError
description: >
  One leaf property of the extraction result that could not be populated,
  while the call as a whole succeeded. Carried in
  ExtractionResult.FieldErrors. A FieldError is the only thing that
  distinguishes "the document does not record this value" from "we could not
  read the value the document records" — a failed leaf is left null, empty,
  or at its type's default, never at a placeholder or sentinel value, so the
  value alone cannot tell a caller which of the two happened. Produced only
  for failures that occur after the container has been opened successfully.
  Anything that fails the container open itself — including a
  nesting-depth-guard breach in the container's own declared structure, and
  any undeclared exception raised during the open — fails the whole call
  instead, because there is then no result object for a FieldError to live
  on ([ydk:contract:extraction/extract] holds the fatal set).
fields:
  FieldPath:
    type: string
    required: true
    description: >
      Dotted path identifying the failed leaf, rooted at the extraction
      result and spelled with the result's own public C# property names, not
      the entity names this spec uses to describe the model — the path must
      match character-for-character the property the caller just read as
      null, so no translation step is ever needed.
      Name mapping (entity -> C# property): on the result, GeneralMetadata ->
      Metadata and Subfiles -> EmbeddedFiles; on FileMetadata, Author ->
      Creator, CreatedAt -> Created, ModifiedAt -> Modified, LastPrintedAt ->
      LastPrinted; every other property keeps its entity name.
      Examples: "Metadata.Created", "Metadata.Title",
      "FormatMetadata.PageCount", "ExtractedText". A failed subfile is keyed
      by its package path, never by a number: "EmbeddedFiles[word/embeddings/oleObject1.bin]",
      "EmbeddedFiles[ObjectPool/_1234/EPRINT]". The package path is the OOXML
      part URI, or for legacy containers the storage/stream path inside the
      container, and is the same value a readable subfile carries on
      [ydk:entity:extraction/SubfileItem]. List positions are not used
      because they shift when items are omitted. The bare collection path
      "EmbeddedFiles", with no key, is used when a failing subfile's package
      path is unknown or empty, and once for a fault in the enumeration of
      the container's subfiles itself (subfiles never reached are absent from
      the list and are not individually reported). Never empty, never null.
  Code:
    type: enum
    values: [CORRUPT_FILE, OVERSIZED_NESTED_CONTENT, UNEXPECTED_FIELD_FAILURE]
    required: true
    description: >
      Machine-readable cause, chosen by the cause and not by the leaf:
      the source record behind the leaf is unreadable or malformed ->
      CORRUPT_FILE; the leaf is an item that breached a
      [ydk:nfr:extraction/nesting-depth-guard] cap ->
      OVERSIZED_NESTED_CONTENT; anything else ->
      UNEXPECTED_FIELD_FAILURE. The third is the residual bucket for a
      failure mode the spec did not anticipate, so it is never used where
      either of the first two fits.
      The vocabulary is only partly shared with the thrown errors:
      CORRUPT_FILE and OVERSIZED_NESTED_CONTENT are the codes of
      [ydk:error:extraction/corrupt-file] and
      [ydk:error:extraction/oversized-nested-content] in their field-level
      roles, so a caller handling both channels sees those two names in
      each, while UNEXPECTED_FIELD_FAILURE has no error manifest and is
      never thrown out of the call at all. This list is closed: a new
      per-field cause means a new value here and a spec change, not an
      ad-hoc string and not a looser reading of UNEXPECTED_FIELD_FAILURE.
  Message:
    type: string
    required: true
    description: >
      Human-readable explanation of why this leaf could not be populated,
      naming the field and the source record or part that failed. For
      display and logs, not for branching — callers branch on Code. The
      originating exception's type, message, and stack are deliberately NOT
      carried here: they go to the telemetry/log sink, so the public result
      does not pin the extraction call to a backing library's exception
      taxonomy.
relationships:
  - target: ydk:entity:extraction/ExtractionResult
    kind: list-member-of
    description: FieldError is the element type of ExtractionResult.FieldErrors.
indexes: []
crud: []
