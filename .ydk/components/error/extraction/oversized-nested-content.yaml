$schema: ydk:schema:error
id: ydk:error:extraction/oversized-nested-content
description: >
  Defense against zip-bomb / CFB-bomb style inputs — a small file whose
  declared internal structure (ZIP uncompressed-size fields, CFB sector/FAT
  counts, or embedded-object nesting) exceeds the hard, always-enforced
  caps in [ydk:nfr:extraction/nesting-depth-guard]. Detection and extraction
  both check declared sizes/depth against those caps BEFORE allocating
  buffers for them. This is the mechanism that actually bounds memory use
  against malicious input; [ydk:nfr:extraction/memory-ceiling] is a
  separate, measured performance target over realistic files, not something
  this check tests against.

  Reported differently by the two contracts.
  [ydk:contract:extraction/detect-mime-type] throws it: detection has no
  per-field channel and is a single verdict, so a bomb-shaped input is
  refused outright. [ydk:contract:extraction/extract] does NOT throw it
  once the container has opened — the guard is enforced per item, the one
  item whose declared size or depth breaches a cap is skipped before any
  buffer is allocated for it, and the breach is recorded as a
  [ydk:entity:extraction/FieldError] with code OVERSIZED_NESTED_CONTENT at
  that item's field path, per
  [ydk:req:extraction/per-field-error-isolation]. The guard is still a hard
  ceiling — nothing oversize is ever allocated — but one bomb-shaped
  embedding no longer denies the caller the rest of an otherwise-good
  document. A breach found while the container itself is being opened
  (before any leaf is populated) is still fatal, because there is then no
  result to attach a FieldError to. The status_code / detail_template /
  response_shape below describe the thrown form; in the field-level form
  only the `code` crosses over.
status_code: 422
code: OVERSIZED_NESTED_CONTENT
detail_template: "Rejected: declared internal size/nesting (${declaredMetric}) exceeds configured limits."
response_shape:
  code: string
  detail: string
  declaredMetric: string
triggers:
  - A ZIP entry's declared uncompressed size exceeds the configured per-entry cap before decompression begins
  - Total declared uncompressed size across all entries exceeds the configured total cap
  - CFB sector/FAT chain length implies a file size wildly larger than FileBytes.Length
  - Embedded-object nesting exceeds the depth guard (relevant if a future version recurses into subfiles; v1 only extracts first-layer, so this mainly guards against a maliciously deep single-layer directory/FAT structure)
related:
  - ydk:contract:extraction/extract
  - ydk:contract:extraction/detect-mime-type
  - ydk:entity:extraction/FieldError
  - ydk:req:extraction/per-field-error-isolation
  - ydk:nfr:extraction/memory-ceiling
  - ydk:nfr:extraction/nesting-depth-guard
