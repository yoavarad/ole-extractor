$schema: ydk:schema:error
id: ydk:error:extraction/invalid-password
description: >
  A password was supplied for an encrypted file whose encryption scheme the
  library can decrypt (OOXML Agile or Standard encryption; xls FILEPASS
  encryption), and the password does not unlock it. Decided by the
  scheme's own password verifier before any document content is
  decrypted, so a wrong password never reaches a parse and is never
  reported as corrupt-file. Distinct from
  [ydk:error:extraction/password-protected], which means "no password was
  supplied" or "this file's encryption is not decryptable by this library
  even with a password". The supplied password MUST NOT appear in the
  detail, the exception message, any log entry, or any FieldError
  ([ydk:req:extraction/password-confidentiality]).
status_code: 422
code: INVALID_PASSWORD
detail_template: "The supplied password does not unlock this encrypted file."
response_shape:
  code: string
  detail: string
triggers:
  - Extract() is given a non-empty ExtractionRequest.Password for an encrypted OOXML package (CFB wrapper with EncryptionInfo + EncryptedPackage, Agile or Standard encryption) and the encryption verifier rejects the derived key
  - Extract() is given a non-empty ExtractionRequest.Password for an xls whose Workbook stream carries a FILEPASS record, the password does not verify, and the file does not open with the built-in default write-protection key either
  - DetectMimeType() is given a non-empty MimeDetectionRequest.Password for an encrypted OOXML package with Agile or Standard encryption and the encryption verifier rejects the derived key
related:
  - ydk:contract:extraction/extract
  - ydk:contract:extraction/detect-mime-type
  - ydk:error:extraction/password-protected
  - ydk:req:extraction/password-decryption
  - ydk:req:extraction/password-confidentiality
