$schema: ydk:schema:error
id: ydk:error:extraction/password-protected
description: >
  The file is encrypted and cannot be extracted with what the caller
  supplied. Raised in two cases:
    - no password was supplied for an encrypted file;
    - the file's encryption is outside what the library decrypts, even
      with a password: XOR-obfuscated doc (deferred, see ADR-013), doc
      encryption schemes other than RC4 and RC4 CryptoAPI, and OOXML
      packages using a scheme other than Agile or Standard (for example
      Extensible encryption or rights-management protection).
  Detected before a full parse is attempted. For doc/ppt this means before
  any open strategy or b2xtranslator call, so an encrypted doc/ppt never
  returns an empty or partial result instead. A wrong password for a
  decryptable file is NOT this error; that is
  [ydk:error:extraction/invalid-password]. A malformed encryption header is
  NOT this error either; that is [ydk:error:extraction/corrupt-file]
  ([ydk:req:extraction/legacy-encryption-header-bounds]). Decryption rules
  are in [ydk:req:extraction/password-decryption] and
  [ydk:req:extraction/legacy-decryption].
status_code: 422
code: PASSWORD_PROTECTED
detail_template: "File is password-protected/encrypted and cannot be extracted without the password."
response_shape:
  code: string
  detail: string
triggers:
  - Extract() finds an EncryptionInfo/EncryptedPackage pair in a CFB container (encrypted OOXML package) and ExtractionRequest.Password is null or empty
  - Extract() finds an encrypted OOXML package whose EncryptionInfo declares a scheme other than Agile or Standard, whether or not a password was supplied
  - Extract() opens an xls whose Workbook stream carries a FILEPASS record that the built-in default write-protection key does not unlock, and ExtractionRequest.Password is null or empty
  - Extract() is given a doc whose FIB base has fEncrypted set, and ExtractionRequest.Password is null or empty (any scheme, XOR included)
  - Extract() is given a doc whose FIB base has fEncrypted and fObfuscated set (XOR obfuscation, deferred), whether or not a password was supplied
  - Extract() is given an encrypted doc whose table-stream encryption header declares a version other than 1.1 or 2.2/3.2/4.2, the fExternal or fAES flag, an AlgID other than RC4 (0x6801), or an AlgIDHash other than SHA-1 (0x8004) or 0, whether or not a password was supplied
  - Extract() is given a ppt whose newest UserEditAtom's encryptSessionPersistIdRef resolves to a CryptSession10Container, and ExtractionRequest.Password is null or empty
  - Extract() is given a ppt whose Current User token is 0xF3D1C4DF (encrypted) but whose encryption structure is absent or unreadable, and ExtractionRequest.Password is null or empty (with a password this is CORRUPT_FILE)
  - NPOI or DocumentFormat.OpenXml throw a library-level "document is encrypted" exception during open when no password was supplied
related:
  - ydk:contract:extraction/extract
  - ydk:error:extraction/invalid-password
  - ydk:req:extraction/password-decryption
  - ydk:req:extraction/legacy-decryption
