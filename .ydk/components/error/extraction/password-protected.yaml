$schema: ydk:schema:error
id: ydk:error:extraction/password-protected
description: >
  The file is encrypted or has a document-open password set (CFB files with
  an EncryptedPackage/EncryptionInfo stream; OOXML files stored inside a CFB
  wrapper per MS-OFFCRYPTO). Extraction fails cleanly and explicitly rather
  than attempting a blind parse — decryption/password entry is explicitly out
  of scope for v1.
status_code: 422
code: PASSWORD_PROTECTED
detail_template: "File is password-protected/encrypted and cannot be extracted without the password."
response_shape:
  code: string
  detail: string
triggers:
  - Extract() detects an EncryptionInfo/EncryptedPackage stream in a CFB container before attempting a full parse
  - NPOI or DocumentFormat.OpenXml throw a library-level "document is encrypted" exception during open
related:
  - ydk:contract:extraction/extract
