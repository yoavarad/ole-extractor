$schema: ydk:schema:req
id: ydk:req:extraction/per-field-error-isolation
description: A failure after the container opens costs the caller one leaf property, not the whole extraction result.
type: business-rule
priority: critical
rule: >
  Once a file's container has been opened successfully, Extract() MUST NOT
  fail the call for any subsequent failure. The unit of isolation is the
  leaf property, not the result and not an output group: each of the twelve
  source-derived FileMetadata properties, each leaf property of whichever
  format-metadata shape applies (WordFormatMetadata, ExcelFormatMetadata,
  PowerPointFormatMetadata), ExtractedText, and each individual embedded
  item succeed or fail independently of every other one.
  A leaf that fails MUST be left at its no-value state and MUST NOT be given
  a placeholder or sentinel: a nullable property is null, ExtractedText is
  the empty string, a failed embedded item is absent from the list, a
  non-nullable count or flag is at its type's default (0, false, empty
  list). For every failed leaf, Extract() MUST append exactly one FieldError
  to ExtractionResult.FieldErrors, identifying the leaf by the field-path
  convention in docs/specs/extraction.md and carrying a Code from that
  entity's closed vocabulary. The FieldErrors entry is the sole
  discriminator between a genuinely-absent/zero/false value and a value
  that could not be read, so a caller that must tell those apart MUST
  consult FieldErrors rather than inspecting the value.
  FieldErrors MUST be an empty collection, never null, when every leaf was
  populated. Entries MUST be in population order (general metadata, then
  format metadata, then text, then embedded items in walk order), and MUST
  carry at most one entry per distinct field path — with the single
  exception of the index-less "EmbeddedFiles" path, which repeats once per
  item whose walk position could not be determined.
  Only the container-open failures remain fatal:
  [ydk:error:extraction/file-too-large],
  [ydk:error:extraction/password-protected],
  [ydk:error:extraction/unsupported-format],
  [ydk:error:extraction/truncated-container],
  [ydk:error:extraction/corrupt-file] in its container-level role, and
  null-request/null-required-field argument validation.
  [ydk:error:extraction/oversized-nested-content],
  [ydk:error:extraction/corrupt-file] in its field-level role, and any
  undeclared exception raised while populating one leaf MUST be reported
  per-field instead of thrown.
failure_behavior: >
  N/A as a runtime error — this rule governs how other failures are
  reported. A violation is either a thrown call-level failure where a
  FieldError was required, or a populated-but-unreported failed leaf
  (a silent empty/default value with no FieldErrors entry). Both are caught
  by the acceptance criteria below, not by a runtime error of their own.
related_components:
  - ydk:entity:extraction/FieldError
  - ydk:entity:extraction/ExtractionResult
  - ydk:entity:extraction/FileMetadata
  - ydk:entity:extraction/WordFormatMetadata
  - ydk:entity:extraction/ExcelFormatMetadata
  - ydk:entity:extraction/PowerPointFormatMetadata
  - ydk:entity:extraction/SubfileItem
  - ydk:contract:extraction/extract
  - ydk:error:extraction/corrupt-file
  - ydk:error:extraction/oversized-nested-content
acceptance_criteria:
  - "Test: every corpus sample that extracts cleanly returns FieldErrors as an empty, non-null collection — asserted for all 6 formats, so an always-populated or always-null collection fails."
  - "Test: a file whose general-metadata property store has one unreadable property extracts successfully, leaves that one property null, leaves the other eleven populated as the manifest records them, and returns exactly one FieldError whose FieldPath is that property's dotted path and whose Code is CORRUPT_FILE."
  - "Test: a format-metadata leaf failure (e.g. an xls whose sheet records cannot be counted) returns SheetCount as 0 plus a FieldError at FormatMetadata.SheetCount, and the same sample's other format-metadata leaves are still populated — proving the caller can distinguish a failed count from a genuine 0 only via FieldErrors."
  - "Test: a sample whose body text cannot be flattened returns ExtractedText as the empty string AND a FieldError at ExtractedText — an empty string with no FieldErrors entry fails the test, which is the regression guard against today's silent-empty behavior."
  - "Test: the adversarial corrupt-embedded-object sample extracts successfully, omits only the bad item from EmbeddedFiles, keeps every good item, and returns one FieldError whose FieldPath is EmbeddedFiles[<walk index of the bad item>] — asserting the walk index, not the returned-list position."
  - "Test: an embedded item whose declared internal size exceeds the nesting-depth guard is dropped with a FieldError whose Code is OVERSIZED_NESTED_CONTENT, and Extract() does not throw."
  - "Test: each of file-too-large, password-protected, unsupported-format, truncated-container, zero-length input, a container that cannot be opened at all, and a null request/null required field still throws — asserting the thrown error, and asserting that no result object is returned, so the fatal set cannot silently drift into the per-field channel."
  - "Test: ExtractManyAsync over a batch containing one field-error-only file reports that item as Succeeded with a non-null Result carrying the FieldErrors and a null Error — a field error is never a batch item error."
  - "Test: FieldErrors contains no duplicate FieldPath values for any corpus or adversarial sample, except for repeated index-less EmbeddedFiles entries."
