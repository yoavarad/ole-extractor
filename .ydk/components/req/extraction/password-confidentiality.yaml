$schema: ydk:schema:req
id: ydk:req:extraction/password-confidentiality
description: A caller-supplied document password never leaves the call that received it.
type: policy
priority: critical
rule: >
  The value of MimeDetectionRequest.Password or ExtractionRequest.Password
  MUST NOT be written to any log or telemetry entry, MUST NOT appear in any
  exception message or exception data (including
  [ydk:error:extraction/invalid-password] and
  [ydk:error:extraction/password-protected]), MUST NOT appear in any
  [ydk:entity:extraction/FieldError] message, MUST NOT be copied onto any
  result object (ExtractionResult, MimeDetectionResult, batch results), and
  MUST NOT be stored in any field, cache, or static that outlives the call.
  The one exception is NPOI's thread-static xls password slot, which is set
  and cleared within the call per [ydk:req:extraction/password-decryption].
  Logs MAY record whether a password was supplied (a boolean), never its
  value, length, or hash. Derived keys and decrypted bytes follow the same
  never-log, never-retain rule. The library does not mutate or clear the
  caller's request object; the caller owns its lifetime.
failure_behavior: N/A — a policy enforced by code review and tests, not a runtime error condition.
related_components:
  - ydk:entity:extraction/MimeDetectionRequest
  - ydk:entity:extraction/ExtractionRequest
  - ydk:entity:extraction/FieldError
  - ydk:error:extraction/invalid-password
  - ydk:error:extraction/password-protected
  - ydk:req:extraction/password-decryption
acceptance_criteria:
  - "Test: for every password-path outcome (success, PASSWORD_PROTECTED, INVALID_PASSWORD, corrupt decrypted package, per-field failures after decryption) a capturing logger and the thrown exception's Message, ToString() and Data contain no occurrence of a distinctive sentinel password string."
  - "Test: no FieldError message and no serialized result (ExtractionResult, MimeDetectionResult, BatchExtractionResult) contains the sentinel password."
  - "Code review: no request-password value is assigned to a field or static other than the per-call thread-static NPOI slot, which is cleared in a finally block."
