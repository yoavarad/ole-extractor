$schema: ydk:schema:req
id: ydk:req:extraction/password-decryption
description: >
  A caller holding a document's open-password can supply it, and the
  encrypted docx/xlsx/pptx/xls/doc/ppt is then decrypted in memory and
  classified and extracted exactly like its unencrypted version.
type: business-rule
priority: high
rule: >
  Scope. MimeDetectionRequest.Password and ExtractionRequest.Password are
  optional; null and empty both mean "no password". Decryptable schemes:
    - OOXML packages wrapped in CFB per MS-OFFCRYPTO with Agile or Standard
      encryption (docx/xlsx/pptx and their macro variants);
    - xls whose Workbook stream carries a FILEPASS record: RC4, CryptoAPI
      RC4 and XOR obfuscation, all handled by the same NPOI HSSF mechanism.
      XOR xls is BLOCKED on yoavarad/npoi#197: until the NPOI re-pin, the
      correct password fails as [ydk:error:extraction/corrupt-file], and
      the XOR acceptance test is gated on that re-pin;
    - doc with RC4 (BinaryRC4) or RC4 CryptoAPI encryption, and ppt with
      RC4 CryptoAPI encryption, per [ydk:req:extraction/legacy-decryption]
      (ADR-013).
  Not decryptable, so they raise [ydk:error:extraction/password-protected]
  with or without a password:
    - XOR-obfuscated doc (deferred, ADR-013);
    - doc encryption schemes other than RC4 and RC4 CryptoAPI;
    - OOXML Extensible encryption and rights-management protection.

  Outcomes on Extract(). Encrypted + decryptable + no password ->
  [ydk:error:extraction/password-protected]. Encrypted + decryptable +
  password that does not verify -> [ydk:error:extraction/invalid-password].
  Encrypted + decryptable + correct password -> a result equal, leaf for
  leaf (metadata, format metadata, flat text, subfiles, field errors), to
  extracting the same document saved without encryption, except
  FileMetadata.FileSizeBytes, which stays the size of the supplied
  (encrypted) input. ExactMimeType and FormatFamily come from the
  caller-supplied DetectedMimeType as for every call. Where an xls stores
  its document properties in encrypted form, they are read with the same
  password, so general metadata also matches the unencrypted twin. An xls
  encrypted only with Excel's built-in default write-protection key has no
  open password: it extracts with or without a supplied password, and a
  supplied password is ignored for it.

  Unencrypted input. A password supplied for a file that is not encrypted
  (any of the six formats, including doc and ppt) is ignored: detection and
  extraction proceed normally, with no error, no FieldError, no log entry
  about the password, and a result identical to the no-password call.

  Outcomes on DetectMimeType(). A CFB root holding EncryptionInfo and
  EncryptedPackage is an encrypted OOXML package regardless of any other
  root entry. No password -> the Unknown result. Correct password (Agile or
  Standard) -> the package is decrypted in memory and classified by the
  OOXML structural check (inner Docx/Xlsx/Pptx, or Unknown). Wrong password
  -> [ydk:error:extraction/invalid-password]. Unsupported scheme -> Unknown.
  Encrypted doc/xls/ppt are classified from their unencrypted CFB
  directory entries; the password is neither used nor verified there.
  Detection never parses document content beyond the structural check.

  Order and guards. [ydk:error:extraction/file-too-large] is checked against
  the supplied (encrypted) bytes first. The CFB wrapper's declared size is
  checked by [ydk:nfr:extraction/nesting-depth-guard] as today. Before any
  key derivation, an Agile spin count above 10,000,000 (the MS-OFFCRYPTO
  maximum) is [ydk:error:extraction/corrupt-file] in its container-level
  role. Before any decrypted buffer is allocated, the EncryptedPackage's
  declared decrypted size is checked against the nesting-depth-guard
  per-entry cap ([ydk:error:extraction/oversized-nested-content] if over)
  and against the EncryptedPackage stream length
  ([ydk:error:extraction/truncated-container] if it declares more than the
  stream holds). The password is verified before any document content is
  decrypted. For Agile encryption, once the password verifies, the
  data-integrity HMAC over the EncryptedPackage stream MUST match the
  decrypted HMAC value from EncryptionInfo; a mismatch is
  [ydk:error:extraction/corrupt-file] in its container-level role (never
  invalid-password, since the password was correct). Standard encryption
  has no integrity data and is not checked. Encrypted doc/ppt use their own
  order and guards ([ydk:req:extraction/legacy-decryption],
  [ydk:req:extraction/legacy-encryption-header-bounds]): the encryption is
  detected before any parse, the header fields are validated before
  verification, and the password is verified before any content is
  decrypted. The decrypted package then passes through every guard and
  error rule an unencrypted package of that format would (ZIP truncation,
  zip-bomb caps, corrupt-file, per-field isolation). Decrypted bytes are
  held only for the duration of the call and are not exposed on any result
  other than as the extracted content itself.

  Subfiles. The password applies to the supplied container only. An
  embedded subfile that is itself encrypted is returned as one opaque item,
  bytes unchanged, never decrypted and never reported as an error.

  Concurrency. NPOI's xls password slot is thread-static. The xls open MUST
  set it immediately before the synchronous HSSF open and clear it in a
  finally block on the same thread, with no await or thread switch between
  set and clear; an xls open without a password MUST also clear it first,
  so a value left by any other code on that thread never applies. No
  password state is shared across calls; concurrent calls, including
  ExtractManyAsync/ExtractManyStreamingAsync items with different
  passwords on the same thread pool, never see each other's password.
  Batch APIs keep their signatures; each request carries its own password.
failure_behavior: >
  [ydk:error:extraction/password-protected] when no password is supplied
  for an encrypted file or the scheme is not decryptable;
  [ydk:error:extraction/invalid-password] when a supplied password does not
  verify; the existing guard/corrupt/truncated errors for malformed
  encryption structures and decrypted packages.
related_components:
  - ydk:contract:extraction/extract
  - ydk:contract:extraction/detect-mime-type
  - ydk:entity:extraction/ExtractionRequest
  - ydk:entity:extraction/MimeDetectionRequest
  - ydk:error:extraction/password-protected
  - ydk:error:extraction/invalid-password
  - ydk:error:extraction/corrupt-file
  - ydk:error:extraction/truncated-container
  - ydk:error:extraction/oversized-nested-content
  - ydk:error:extraction/file-too-large
  - ydk:nfr:extraction/nesting-depth-guard
  - ydk:req:extraction/password-confidentiality
  - ydk:req:extraction/legacy-decryption
acceptance_criteria:
  - "Test (per sample): Agile docx, Agile xlsx, Agile pptx, Standard-encryption OOXML, RC4 xls and CryptoAPI xls each extract with the correct password to a result equal leaf for leaf to the unencrypted twin's recorded expectations (FileSizeBytes excepted)."
  - "Test (per sample): each of those samples with no password throws PASSWORD_PROTECTED and with a wrong password throws INVALID_PASSWORD; neither returns a result."
  - "Test: encrypted doc (RC4, CryptoAPI) and encrypted ppt follow the same three outcomes (no password, wrong password, correct password); per-sample expectations: ydk:req:extraction/legacy-decryption; an XOR-obfuscated doc throws PASSWORD_PROTECTED both without and with a password."
  - "Gated on the yoavarad/npoi#197 re-pin: an XOR-obfuscated xls extracts with the correct password to its expected cells."
  - "Test: every unencrypted corpus sample of all six formats, given a non-empty password, detects and extracts to exactly the no-password result (same format, same leaves, same FieldErrors)."
  - "Test: an xls encrypted only with the default write-protection key extracts without a password and with an arbitrary password."
  - "Test: DetectMimeType on an encrypted OOXML package returns Unknown without a password, the inner Docx/Xlsx/Pptx with the correct password, and throws INVALID_PASSWORD with a wrong one; samples/adversarial/password-protected.docx (which also carries a WordDocument stub) returns Unknown without a password."
  - "Test: DetectMimeType on encrypted doc/xls/ppt returns Doc/Xls/Ppt with no password, a wrong password, and a correct password alike."
  - "Test: a crafted encrypted package whose Agile spin count exceeds 10,000,000 throws CORRUPT_FILE without running key derivation (verified via a counter or spy, not wall clock)."
  - "Test: an Agile sample whose EncryptedPackage bytes were altered after encryption throws CORRUPT_FILE with the correct password (integrity HMAC mismatch), and INVALID_PASSWORD with a wrong one."
  - "Test: a crafted EncryptedPackage declaring a decrypted size over the per-entry cap throws OVERSIZED_NESTED_CONTENT before a decrypted buffer is allocated; one declaring more than the stream holds throws TRUNCATED_CONTAINER."
  - "Test: an encrypted subfile embedded in a container is returned opaque with bytes unchanged and no FieldError."
  - "Test: concurrent xls extractions with different passwords (and some with none), gated by a Barrier on the same pool, each get their own correct outcome; after each call the thread's HSSF password slot is null."
